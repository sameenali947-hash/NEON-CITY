<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>VICE CITY</title>
<style>
  body{margin:0;overflow:hidden;background:#222;font-family:sans-serif;color:#fff;user-select:none}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  #speedo{position:absolute;bottom:20px;left:20px;font-size:50px;font-weight:bold;color:#fff;text-shadow:0 0 10px #ff00ff;display:none}
  #overlay{position:fixed;inset:0;background:rgba(10,0,20,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;cursor:pointer}
  h1{font-size:60px;margin:0 0 10px;color:#ff00ff;text-shadow:0 0 20px #ff00ff}
  p{font-size:20px;color:#0ff}
</style>
</head>
<body>
<div id="hud"><div id="speedo">0 <span>MPH</span></div></div>
<div id="overlay"><h1>VICE CITY</h1><p>Click to drive</p></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// 1. Setup Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xff7597); // Simple Pink Sky
scene.fog = new THREE.Fog(0xff7597, 50, 300);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// 2. Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(50, 100, 50);
sun.castShadow = true;
scene.add(sun);

// 3. Physics World
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -20, 0) });

// 4. Ground (Simple Dark Road)
const groundMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), quaternion: new CANNON.Quaternion().setFromEuler(-Math.PI/2, 0, 0) }));

// 5. Buildings & Trees
for(let x = -100; x <= 100; x += 40) {
  for(let z = -100; z <= 100; z += 40) {
    if(Math.abs(x) < 20 && Math.abs(z) < 20) continue; // Spawn clear
    
    // Buildings
    const h = Math.random() * 40 + 10;
    const b = new THREE.Mesh(new THREE.BoxGeometry(15, h, 15), new THREE.MeshStandardMaterial({ color: 0x334455 }));
    b.position.set(x, h/2, z); b.castShadow = true; b.receiveShadow = true;
    scene.add(b);
    world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(7.5, h/2, 7.5)), position: new CANNON.Vec3(x, h/2, z) }));

    // Neon Signs
    if(Math.random() > 0.5) {
      const neon = new THREE.Mesh(new THREE.BoxGeometry(15.5, 2, 15.5), new THREE.MeshBasicMaterial({ color: Math.random()>0.5 ? 0xff00ff : 0x00ffff }));
      neon.position.set(x, Math.random()*h, z);
      scene.add(neon);
    }
  }
}

// 6. Player Car (White with Red Stripe)
const carGroup = new THREE.Group();
const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 0.6, 4), new THREE.MeshStandardMaterial({ color: 0xffffff }));
bodyMesh.position.y = 0.6; bodyMesh.castShadow = true;
const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.61, 4), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
stripe.position.y = 0.6;
const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 2), new THREE.MeshStandardMaterial({ color: 0x000000 }));
cabin.position.set(0, 1.2, -0.2);
const lightL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.1), new THREE.MeshBasicMaterial({ color: 0xffffff }));
lightL.position.set(0.6, 0.6, 2.05);
const lightR = lightL.clone(); lightR.position.x = -0.6;
carGroup.add(bodyMesh, stripe, cabin, lightL, lightR);
scene.add(carGroup);

const carBody = new CANNON.Body({ mass: 100 });
carBody.addShape(new CANNON.Box(new CANNON.Vec3(1, 0.3, 2)));
carBody.position.set(0, 2, 0);
world.addBody(carBody);

// 7. Controls
const keys = { w: false, a: false, s: false, d: false };
let camAngle = Math.PI;
const overlay = document.getElementById('overlay');

overlay.addEventListener('click', () => {
  overlay.style.display = 'none';
  document.getElementById('speedo').style.display = 'block';
  renderer.domElement.requestPointerLock();
});
document.addEventListener('mousemove', (e) => { if (document.pointerLockElement === renderer.domElement) camAngle -= e.movementX * 0.002; });
addEventListener('keydown', e => { if(['w','a','s','d'].includes(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
addEventListener('keyup', e => { if(['w','a','s','d'].includes(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

// 8. Game Loop
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  world.step(1/60, Math.min(clock.getDelta(), 0.1), 3);

  // Sync Car
  carGroup.position.copy(carBody.position);
  carGroup.quaternion.copy(carBody.quaternion);

  // Keep car flat
  carBody.angularVelocity.x = 0;
  carBody.angularVelocity.z = 0;

  // Driving (Super simple, no crashes)
  const forward = new CANNON.Vec3(0, 0, 1);
  carBody.quaternion.vmult(forward, forward);
  
  if (keys.w) { carBody.velocity.x = forward.x * 25; carBody.velocity.z = forward.z * 25; }
  else if (keys.s) { carBody.velocity.x = -forward.x * 15; carBody.velocity.z = -forward.z * 15; }
  else { carBody.velocity.x *= 0.95; carBody.velocity.z *= 0.95; } // Friction

  if (keys.a) carBody.angularVelocity.y = 2;
  else if (keys.d) carBody.angularVelocity.y = -2;
  else carBody.angularVelocity.y = 0;

  // Camera
  camera.position.x = carBody.position.x - Math.sin(camAngle) * 10;
  camera.position.z = carBody.position.z - Math.cos(camAngle) * 10;
  camera.position.y = carBody.position.y + 4;
  camera.lookAt(carBody.position.x, carBody.position.y + 1, carBody.position.z);

  // HUD
  document.getElementById('speedo').innerHTML = Math.floor(carBody.velocity.length() * 2.2) + ' <span>MPH</span>';

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BOMB TAG: DRIFT ARENA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');
  body{margin:0;overflow:hidden;background:#111;font-family:'Montserrat',sans-serif;color:#fff;user-select:none}
  canvas{display:block}
  
  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}
  #topBar{position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center}
  #bombTimer{font-size:40px;font-weight:900;color:#ff0000;text-shadow:0 0 20px #ff0000;display:none}
  #bombPrompt{font-size:20px;color:#fff;text-shadow:0 2px 5px #000;background:rgba(0,0,0,0.5);padding:10px 20px;border-radius:20px;margin-top:10px;display:none}
  #speedo{position:absolute;bottom:30px;right:30px;font-size:50px;font-weight:900;font-style:italic;text-shadow:0 0 10px #00ffff}
  #speedo span{font-size:16px;color:#00ffff}
  #coins{position:absolute;top:20px;right:30px;font-size:24px;font-weight:900;color:#ffcc00;text-shadow:0 0 10px #ffcc00}
  #spectating{position:absolute;top:20px;left:30px;font-size:20px;color:#00ffff;font-weight:bold;display:none}

  /* UI Overlays */
  .screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,20,0.9);backdrop-filter:blur(10px);transition:opacity 0.3s}
  .hidden{opacity:0;pointer-events:none}
  h1{font-size:60px;margin:0;color:#fff;text-shadow:0 0 20px #ff00ff;letter-spacing:3px}
  h2{font-size:20px;color:#00ffff;margin:10px 0 30px;letter-spacing:2px}
  
  .btn{padding:15px 40px;font-size:20px;font-weight:900;color:#000;background:#00ffff;border:none;border-radius:10px;cursor:pointer;margin:10px;transition:transform 0.1s, box-shadow 0.2s;font-family:'Montserrat',sans-serif}
  .btn:hover{transform:scale(1.05);box-shadow:0 0 20px #00ffff}
  .btn-pink{background:#ff00ff;color:#fff}
  .btn-pink:hover{box-shadow:0 0 20px #ff00ff}
  
  .input-group{display:flex;gap:10px;margin-top:20px}
  input{padding:15px;font-size:20px;text-align:center;border-radius:10px;border:2px solid #00ffff;background:rgba(0,0,0,0.5);color:#fff;width:150px;font-family:'Montserrat',sans-serif;letter-spacing:5px}
  
  /* Car Shop */
  .shop-grid{display:flex;gap:20px;margin-top:20px}
  .car-card{background:rgba(255,255,255,0.1);border:2px solid #333;padding:20px;border-radius:15px;text-align:center;width:200px;transition:0.2s}
  .car-card:hover{border-color:#00ffff;transform:translateY(-5px)}
  .car-card.owned{border-color:#00ff00}
  .car-card h3{margin:0 0 10px;color:#fff}
  .car-card p{margin:0 0 15px;color:#ffcc00;font-weight:bold}
  
  /* Voting */
  #voteUI{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
  .vote-title{font-size:24px;margin-bottom:10px;text-shadow:0 2px 5px #000}
  .vote-plates{display:flex;gap:50px;justify-content:center}
  .plate{width:100px;height:100px;background:rgba(0,0,0,0.6);border:4px solid #fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px}
  .plate.active{border-color:#00ff00;box-shadow:0 0 20px #00ff00}
  .plate-votes{font-size:30px;font-weight:900;color:#ffcc00}
</style>
</head>
<body>

<!-- HUD -->
<div id="hud">
  <div id="topBar">
    <div id="bombTimer">30</div>
    <div id="bombPrompt">YOU HAVE THE BOMB! RAM SOMEONE!</div>
  </div>
  <div id="speedo">0 <span>KM/H</span></div>
  <div id="coins">🪙 0</div>
  <div id="spectating">SPECTATING (Press SPACE to cycle)</div>
</div>

<!-- HOME MENU -->
<div id="homeScreen" class="screen">
  <h1>DRIFT ARENA</h1>
  <h2>BOMB TAG</h2>
  <button class="btn" onclick="startTutorial()">TUTORIAL</button>
  <button class="btn btn-pink" onclick="showServerSelect()">PLAY</button>
</div>

<!-- SERVER SELECT -->
<div id="serverScreen" class="screen hidden">
  <h1>SELECT SERVER</h1>
  <button class="btn" onclick="joinGame(false)">🌍 GLOBAL SERVER</button>
  <div class="input-group">
    <input type="text" id="privateCode" placeholder="12345" maxlength="5">
    <button class="btn btn-pink" onclick="joinGame(true)">🔒 JOIN PRIVATE</button>
  </div>
  <button class="btn" style="background:#555; color:#fff; margin-top:20px" onclick="showScreen('homeScreen')">BACK</button>
</div>

<!-- LOBBY -->
<div id="lobbyScreen" class="screen hidden">
  <h1>LOBBY</h1>
  <div style="display:flex; gap:20px;">
    <div>
      <h2>CAR SHOP</h2>
      <div class="shop-grid" id="carShop"></div>
    </div>
  </div>
  <div id="voteUI" style="position:relative; transform:none; margin-top:30px; pointer-events:auto;">
    <div class="vote-title">VOTE FOR NEXT MAP</div>
    <div class="vote-plates">
      <div class="plate" id="vote0" onclick="voteMap(0)"><span>Urban</span><div class="plate-votes" id="v0">0</div></div>
      <div class="plate" id="vote1" onclick="voteMap(1)"><span>Sunset</span><div class="plate-votes" id="v1">0</div></div>
      <div class="plate" id="vote2" onclick="voteMap(2)"><span>Cyber</span><div class="plate-votes" id="v2">0</div></div>
    </div>
  </div>
  <h2 style="color:#ffcc00; margin-top:20px;" id="lobbyTimer">Starting in: 15s</h2>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// --- 1. GLOBAL VARIABLES & ECONOMY ---
let driftCoins = parseInt(localStorage.getItem('driftCoins')) || 0;
let ownedCars = JSON.parse(localStorage.getItem('ownedCars')) || [0];
let selectedCar = parseInt(localStorage.getItem('selectedCar')) || 0;
let gameState = 'HOME'; // HOME, LOBBY, PLAYING

const carsDB = [
  { id: 0, name: 'Street Cruiser', price: 0, color: 0x3498db, speed: 400, handling: 2.5 },
  { id: 1, name: 'Vice Super', price: 100, color: 0xff0055, speed: 500, handling: 2.8 },
  { id: 2, name: 'Cyber Drift', price: 300, color: 0x00ffff, speed: 600, handling: 3.2 },
  { id: 3, name: 'Gold Phantom', price: 1000, color: 0xffd700, speed: 750, handling: 3.5 }
];

// --- 2. THREE.JS & CANNON SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 100, 400);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -20, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);

// Lighting
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffeedd, 1.5);
sun.position.set(50, 100, 50); sun.castShadow = true;
sun.shadow.camera.left = -100; sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100; sun.shadow.camera.bottom = -100;
scene.add(sun);

// --- 3. WORLD GENERATION (ARENA & LOBBY) ---
const arenaRadius = 150;
const mapColors = [0x333333, 0xff7597, 0x00ffff];
let currentMapIndex = 0;

// Ground (Arena)
const arenaGeo = new THREE.CircleGeometry(arenaRadius, 64);
const arenaMat = new THREE.MeshStandardMaterial({ color: mapColors[0] });
const arenaMesh = new THREE.Mesh(arenaGeo, arenaMat);
arenaMesh.rotation.x = -Math.PI/2; arenaMesh.receiveShadow = true;
scene.add(arenaMesh);

// Cylinder Walls
const wallGeo = new THREE.CylinderGeometry(arenaRadius, arenaRadius, 30, 64, 1, true);
const wallMat = new THREE.MeshStandardMaterial({ color: 0x222222, side: THREE.BackSide });
const wallMesh = new THREE.Mesh(wallGeo, wallMat);
wallMesh.position.y = 15;
scene.add(wallMesh);

// Physics Ground & Walls
world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), quaternion: new CANNON.Quaternion().setFromEuler(-Math.PI/2, 0, 0) }));
const wallBody = new CANNON.Body({ mass: 0 });
for(let i=0; i<16; i++) {
  const angle = (i/16) * Math.PI * 2;
  const x = Math.cos(angle) * arenaRadius;
  const z = Math.sin(angle) * arenaRadius;
  const box = new CANNON.Box(new CANNON.Vec3(arenaRadius * 0.2, 15, 2));
  const q = new CANNON.Quaternion().setFromEuler(0, -angle, 0);
  wallBody.addShape(box, new CANNON.Vec3(x, 15, z), q);
}
world.addBody(wallBody);

// Lobby (Floating Platform)
const lobbyGeo = new THREE.CylinderGeometry(40, 40, 4, 32);
const lobbyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x444444 });
const lobbyMesh = new THREE.Mesh(lobbyGeo, lobbyMat);
lobbyMesh.position.set(0, 60, 0); lobbyMesh.receiveShadow = true;
scene.add(lobbyMesh);

// Pressure Plates (Visuals only, logic handles detection)
for(let i=0; i<3; i++) {
  const plateGeo = new THREE.BoxGeometry(10, 0.5, 10);
  const plateMat = new THREE.MeshStandardMaterial({ color: 0xffcc00 });
  const plate = new THREE.Mesh(plateGeo, plateMat);
  plate.position.set((i-1) * 20, 62.5, 0);
  scene.add(plate);
}

// --- 4. CAR FACTORY (Detailed Procedural Cars) ---
function createCarMesh(colorHex) {
  const g = new THREE.Group();
  const paint = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.8, roughness: 0.2 });
  const glass = new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 1, roughness: 0 });
  
  const chassis = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 4), paint);
  chassis.position.y = 0.5; chassis.castShadow = true; g.add(chassis);
  
  const hood = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.2, 1.2), paint);
  hood.position.set(0, 0.7, 1.3); hood.castShadow = true; g.add(hood);
  
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 1.8), glass);
  cabin.position.set(0, 1.0, -0.2); g.add(cabin);
  
  const spoiler = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 0.3), paint);
  spoiler.position.set(0, 1.0, -1.9); g.add(spoiler);
  
  // Lights
  const hl = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  hl.position.set(0, 0.6, 2.01); g.add(hl);
  const tl = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
  tl.position.set(0, 0.6, -2.01); g.add(tl);
  
  // Wheels
  const wGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 12); wGeo.rotateZ(Math.PI/2);
  const wMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  const wheels = [];
  [[1,0.4,1.3], [-1,0.4,1.3], [1,0.4,-1.3], [-1,0.4,-1.3]].forEach(p => {
    const w = new THREE.Mesh(wGeo, wMat);
    w.position.set(p[0], p[1], p[2]); w.castShadow = true;
    g.add(w); wheels.push(w);
  });
  
  g.userData.wheels = wheels;
  return g;
}

// --- 5. VEHICLE PHYSICS & BOTS ---
const players = []; // { mesh, body, vehicle, isBot, hasBomb, alive }
let playerVehicle = null;
let cameraMode = 0; // 0=3rd person, 1=1st person, 2=hood

function spawnVehicle(x, z, colorHex, isBot = false) {
  const mesh = createCarMesh(colorHex);
  scene.add(mesh);
  
  const body = new CANNON.Body({ mass: 150 });
  body.addShape(new CANNON.Box(new CANNON.Vec3(1, 0.3, 2)));
  body.position.set(x, 2, z);
  world.addBody(body);
  
  const vehicle = new CANNON.RaycastVehicle({
    chassisBody: body,
    indexRightAxis: 0, indexUpAxis: 1, indexForwardAxis: 2
  });
  
  const wheelOpts = {
    radius: 0.4, directionLocal: new CANNON.Vec3(0, -1, 0),
    suspensionStiffness: 30, suspensionRestLength: 0.3, frictionSlip: 2.5,
    dampingRelaxation: 2.3, dampingCompression: 4.4, maxSuspensionForce: 100000,
    rollInfluence: 0.01, axleLocal: new CANNON.Vec3(-1, 0, 0),
    chassisConnectionPointLocal: new CANNON.Vec3(1, 1, 0), maxSuspensionTravel: 0.3
  };
  wheelOpts.chassisConnectionPointLocal.set(1, 0.3, 1.3); vehicle.addWheel(wheelOpts);
  wheelOpts.chassisConnectionPointLocal.set(-1, 0.3, 1.3); vehicle.addWheel(wheelOpts);
  wheelOpts.chassisConnectionPointLocal.set(1, 0.3, -1.3); vehicle.addWheel(wheelOpts);
  wheelOpts.chassisConnectionPointLocal.set(-1, 0.3, -1.3); vehicle.addWheel(wheelOpts);
  vehicle.addToWorld(world);
  
  const p = { mesh, body, vehicle, isBot, hasBomb: false, alive: true };
  players.push(p);
  return p;
}

// --- 6. UI LOGIC (Menu, Lobby, Shop, Voting) ---
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  document.getElementById('hud').style.display = (id === 'lobbyScreen' || gameState === 'PLAYING') ? 'none' : 'none';
}

function updateCoins() {
  document.getElementById('coins').innerText = `🪙 ${driftCoins}`;
  localStorage.setItem('driftCoins', driftCoins);
}

function renderShop() {
  const shop = document.getElementById('carShop');
  shop.innerHTML = '';
  carsDB.forEach(car => {
    const div = document.createElement('div');
    const owned = ownedCars.includes(car.id);
    div.className = `car-card ${owned ? 'owned' : ''}`;
    div.innerHTML = `
      <h3>${car.name}</h3>
      <p>${owned ? 'OWNED' : '🪙 ' + car.price}</p>
      <button class="btn ${owned ? 'btn-pink' : ''}" onclick="selectCar(${car.id}, ${car.price}, ${owned})">
        ${selectedCar === car.id ? 'SELECTED' : (owned ? 'SELECT' : 'BUY')}
      </button>
    `;
    shop.appendChild(div);
  });
}

window.selectCar = (id, price, owned) => {
  if (owned) {
    selectedCar = id;
  } else {
    if (driftCoins >= price) {
      driftCoins -= price;
      ownedCars.push(id);
      selectedCar = id;
      updateCoins();
    } else {
      alert("Not enough Drift Coins!");
    }
  }
  localStorage.setItem('ownedCars', JSON.stringify(ownedCars));
  localStorage.setItem('selectedCar', selectedCar);
  renderShop();
};

window.showServerSelect = () => {
  updateCoins();
  showScreen('serverScreen');
};

window.startTutorial = () => {
  alert("TUTORIAL:\n1. Use W, A, S, D to drive.\n2. Hold SPACE to Drift.\n3. If you get the bomb, RAM someone to pass it.\n4. Press C to change camera view.\nWelcome to Drift Arena!");
};

window.joinGame = (isPrivate) => {
  if (isPrivate && document.getElementById('privateCode').value.length !== 5) {
    alert("Enter a 5-digit code!"); return;
  }
  
  // Fake Matchmaking
  showScreen('lobbyScreen');
  gameState = 'LOBBY';
  renderShop();
  resetGame();
  
  // Start countdown for map vote
  let voteTime = 15;
  const voteTimer = setInterval(() => {
    voteTime--;
    document.getElementById('lobbyTimer').innerText = `Starting in: ${voteTime}s`;
    
    // Bots vote randomly
    if (voteTime === 10 || voteTime === 5) {
      document.getElementById('v' + Math.floor(Math.random()*3)).innerText = 
        parseInt(document.getElementById('v' + Math.floor(Math.random()*3)).innerText) + 1;
    }

    if (voteTime <= 0) {
      clearInterval(voteTimer);
      startMatch();
    }
  }, 1000);
};

window.voteMap = (index) => {
  document.querySelectorAll('.plate').forEach(p => p.classList.remove('active'));
  document.getElementById('vote' + index).classList.add('active');
  const counter = document.getElementById('v' + index);
  counter.innerText = parseInt(counter.innerText) + 1;
};

// --- 7. GAME LOGIC (Bomb Tag) ---
let bombHolder = null;
let bombTimer = 30;
let bombMesh = new THREE.Mesh(new THREE.SphereGeometry(0.8), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
scene.add(bombMesh);
bombMesh.visible = false;

function resetGame() {
  players.forEach(p => {
    world.removeBody(p.body);
    scene.remove(p.mesh);
  });
  players.length = 0;
  bombHolder = null;
  bombMesh.visible = false;
  bombTimer = 30;
}

function startMatch() {
  showScreen(''); // Hide all UI
  document.getElementById('hud').style.display = 'block';
  gameState = 'PLAYING';
  
  // Set map color
  arenaMat.color.setHex(mapColors[Math.floor(Math.random()*3)]);
  
  // Spawn Player
  const p = spawnVehicle(0, 0, carsDB[selectedCar].color);
  playerVehicle = p;
  
  // Spawn 5 Bots
  for(let i=0; i<5; i++) {
    const angle = (i/5) * Math.PI * 2;
    spawnVehicle(Math.cos(angle)*50, Math.sin(angle)*50, 0xff00ff, true);
  }
  
  // Give someone the bomb
  giveBomb(players[Math.floor(Math.random()*players.length)]);
  document.getElementById('bombTimer').style.display = 'block';
}

function giveBomb(player) {
  if (bombHolder) bombHolder.hasBomb = false;
  bombHolder = player;
  player.hasBomb = true;
  bombTimer = 30;
  
  if (player === playerVehicle) {
    document.getElementById('bombPrompt').style.display = 'block';
  } else {
    document.getElementById('bombPrompt').style.display = 'none';
  }
}

function explodeBomb() {
  // Explosion logic
  bombHolder.alive = false;
  bombHolder.mesh.visible = false;
  world.removeBody(bombHolder.body);
  
  // Check win condition
  const alive = players.filter(p => p.alive);
  if (alive.length === 1) {
    // Game over
    if (alive[0] === playerVehicle) {
      driftCoins += 100;
      updateCoins();
      alert("YOU WIN! +100 Drift Coins");
    } else {
      alert("You were eliminated!");
    }
    showScreen('lobbyScreen');
    gameState = 'LOBBY';
    resetGame();
    return;
  }
  
  // Pass bomb to random alive player
  giveBomb(alive[Math.floor(Math.random()*alive.length)]);
}

// --- 8. CONTROLS & CAMERA ---
const keys = { w: false, a: false, s: false, d: false, space: false };
let camAngle = 0;

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if(['w','a','s','d',' '].includes(k)) keys[k === ' ' ? 'space' : k] = true;
  if(k === 'c') cameraMode = (cameraMode + 1) % 3;
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if(['w','a','s','d',' '].includes(k)) keys[k === ' ' ? 'space' : k] = false;
});
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement === renderer.domElement) camAngle -= e.movementX * 0.002;
});

// --- 9. MAIN LOOP ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  if (gameState === 'PLAYING') {
    // Bomb Timer
    if (bombHolder) {
      bombTimer -= dt;
      document.getElementById('bombTimer').innerText = Math.ceil(bombTimer);
      if (bombTimer <= 0) explodeBomb();
      
      // Follow bomb with mesh
      bombMesh.visible = true;
      bombMesh.position.copy(bombHolder.body.position);
      bombMesh.position.y += 2;
      bombMesh.rotation.y += dt * 2;
      
      // Bomb collision check (Tag)
      players.forEach(p => {
        if (p !== bombHolder && p.alive) {
          const dist = p.body.position.distanceTo(bombHolder.body.position);
          if (dist < 4) {
            giveBomb(p);
          }
        }
      });
    }
    
    // Player Physics
    if (playerVehicle && playerVehicle.alive) {
      const maxSteer = 0.4;
      const engineForce = carsDB[selectedCar].speed;
      const isDrifting = keys.space;
      
      playerVehicle.vehicle.setSteeringValue(keys.a ? maxSteer : keys.d ? -maxSteer : 0, 0);
      playerVehicle.vehicle.setSteeringValue(keys.a ? maxSteer : keys.d ? -maxSteer : 0, 1);
      
      if (keys.w) {
        playerVehicle.vehicle.applyEngineForce(-engineForce, 2);
        playerVehicle.vehicle.applyEngineForce(-engineForce, 3);
      } else if (keys.s) {
        playerVehicle.vehicle.applyEngineForce(engineForce/2, 2);
        playerVehicle.vehicle.applyEngineForce(engineForce/2, 3);
      } else {
        playerVehicle.vehicle.applyEngineForce(0, 2);
        playerVehicle.vehicle.applyEngineForce(0, 3);
      }
      
      // Drifting mechanics
      playerVehicle.vehicle.wheelInfos.forEach(w => {
        w.frictionSlip = isDrifting ? 0.5 : 2.5;
      });
      playerVehicle.vehicle.setBrake(isDrifting ? 10 : 0, 0);
      playerVehicle.vehicle.setBrake(isDrifting ? 10 : 0, 1);
      
      // Update Speedo
      document.getElementById('speedo').innerHTML = Math.floor(Math.abs(playerVehicle.vehicle.currentVehicleSpeedKmHour)) + ' <span>KM/H</span>';
    }
    
    // Bot AI
    players.forEach(p => {
      if (p.isBot && p.alive) {
        let targetX = 0, targetZ = 0;
        if (p.hasBomb) {
          // Chase nearest player
          let nearest = null, minDist = Infinity;
          players.forEach(other => {
            if (other !== p && other.alive) {
              const d = p.body.position.distanceTo(other.body.position);
              if (d < minDist) { minDist = d; nearest = other; }
            }
          });
          if (nearest) { targetX = nearest.body.position.x; targetZ = nearest.body.position.z; }
        } else {
          // Flee from bomb
          if (bombHolder) {
            targetX = p.body.position.x - (bombHolder.body.position.x - p.body.position.x);
            targetZ = p.body.position.z - (bombHolder.body.position.z - p.body.position.z);
          }
        }
        
        const angleToTarget = Math.atan2(targetX - p.body.position.x, targetZ - p.body.position.z);
        const currentAngle = Math.atan2(p.body.velocity.x, p.body.velocity.z);
        let diff = angleToTarget - currentAngle;
        while(diff > Math.PI) diff -= Math.PI*2;
        while(diff < -Math.PI) diff += Math.PI*2;
        
        p.vehicle.setSteeringValue(Math.max(-0.4, Math.min(0.4, diff)), 0);
        p.vehicle.setSteeringValue(Math.max(-0.4, Math.min(0.4, diff)), 1);
        p.vehicle.applyEngineForce(-300, 2);
        p.vehicle.applyEngineForce(-300, 3);
      }
    });
    
    world.step(1/60, dt, 3);
    
    // Sync meshes
    players.forEach(p => {
      if (p.alive) {
        p.mesh.position.copy(p.body.position);
        p.mesh.quaternion.copy(p.body.quaternion);
        p.vehicle.wheelInfos.forEach((w, i) => {
          p.mesh.userData.wheels[i].position.copy(w.worldTransform.position);
          p.mesh.userData.wheels[i].quaternion.copy(w.worldTransform.quaternion);
        });
      }
    });
    
    // Camera Logic
    if (playerVehicle && playerVehicle.alive) {
      const pos = playerVehicle.body.position;
      if (cameraMode === 0) { // 3rd Person
        camera.position.set(pos.x - Math.sin(camAngle)*10, pos.y + 5, pos.z - Math.cos(camAngle)*10);
        camera.lookAt(pos.x, pos.y + 1, pos.z);
      } else if (cameraMode === 1) { // 1st Person
        camera.position.set(pos.x, pos.y + 1.5, pos.z);
        camera.lookAt(pos.x + Math.sin(camAngle)*10, pos.y + 1.5, pos.z + Math.cos(camAngle)*10);
      } else { // Hood
        camera.position.set(pos.x + Math.sin(camAngle)*1.5, pos.y + 1.2, pos.z + Math.cos(camAngle)*1.5);
        camera.lookAt(pos.x + Math.sin(camAngle)*10, pos.y + 1.2, pos.z + Math.cos(camAngle)*10);
      }
    }
  } else if (gameState === 'LOBBY') {
    // Lobby Camera
    camera.position.set(0, 80, 80);
    camera.lookAt(0, 60, 0);
    world.step(1/60, dt, 3);
  }

  renderer.render(scene, camera);
}

// Initialize
updateCoins();
renderShop();
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>VICE CITY</title>
<style>
  body{margin:0;overflow:hidden;background:#111;font-family:'Segoe UI',Arial,sans-serif;color:#fff;user-select:none}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  #speedo{position:absolute;bottom:30px;right:30px;font-size:60px;font-weight:900;color:#fff;text-shadow:0 0 20px #ff00ff, 0 0 10px #00ffff;display:none;font-style:italic;letter-spacing:-2px}
  #speedo span{font-size:18px;color:#00ffff;letter-spacing:2px}
  #minimap{position:absolute;bottom:30px;left:30px;width:160px;height:160px;border-radius:50%;border:4px solid rgba(255,255,255,0.8);background:rgba(0,0,0,0.6);box-shadow:0 0 20px rgba(0,0,0,0.5)}
  
  #overlay{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(180deg, #1a0b2e 0%, #ff00ff 100%);
    transition: opacity 0.5s; cursor:pointer;
  }
  h1{font-size:80px;margin:0;color:#fff;font-style:italic;letter-spacing:8px;text-shadow:0 0 30px #00ffff, 0 0 60px #00ffff}
  h2{font-size:20px;color:#fff;margin-top:10px;letter-spacing:2px}
</style>
</head>
<body>

<div id="hud">
  <div id="speedo">0 <span>KM/H</span></div>
  <canvas id="minimap" width="160" height="160"></canvas>
</div>

<div id="overlay">
  <h1>VICE CITY</h1>
  <h2>VERSION 2.0 (PURE PHYSICS)</h2>
  <p style="margin-top:20px; font-weight:bold; color:#0ff;">CLICK TO PLAY</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.1/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// --- 1. ENGINE SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB); // Bright Day Sky
scene.fog = new THREE.Fog(0x87CEEB, 100, 300);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(50, 100, -50);
scene.add(sun);

// --- 2. PROCEDURAL ROAD TEXTURE ---
function makeRoadTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#333333'; ctx.fillRect(0, 0, 512, 512);
  ctx.fillStyle = '#f5b041'; ctx.fillRect(248, 0, 6, 512); ctx.fillRect(258, 0, 6, 512);
  ctx.fillStyle = '#ffffff';
  for(let i=0; i<512; i+=64) { ctx.fillRect(120, i, 4, 32); ctx.fillRect(388, i, 4, 32); }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(2, 20);
  return tex;
}

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1000, 1000),
  new THREE.MeshStandardMaterial({ map: makeRoadTexture(), roughness: 0.8 })
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// --- 3. BUILD CITY ---
const collidables = [];
const neonColors = [0xff00ff, 0x00ffff, 0xffaa00];

for(let x = -200; x <= 200; x += 50) {
  for(let z = -200; z <= 200; z += 50) {
    if(Math.abs(x) < 20 && Math.abs(z) < 20) continue; // Clear spawn

    const h = Math.random() * 40 + 20;
    const w = Math.random() * 10 + 15;
    const d = Math.random() * 10 + 15;
    
    const building = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshLambertMaterial({ color: 0x888888 })
    );
    building.position.set(x, h/2, z);
    scene.add(building);
    collidables.push({ x: x, z: z, r: Math.max(w, d)/2 + 2 });

    // Neon Strips
    if(Math.random() > 0.3) {
      const neon = new THREE.Mesh(
        new THREE.BoxGeometry(w+1, 2, d+1),
        new THREE.MeshBasicMaterial({ color: neonColors[Math.floor(Math.random()*3)] })
      );
      neon.position.set(x, Math.random()*h, z);
      scene.add(neon);
    }
  }
}

// --- 4. PLAYER CAR (100% Pure Math Physics) ---
const car = new THREE.Group();
const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 4.5), new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.5, roughness: 0.2 }));
body.position.y = 0.6;
const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.51, 4.5), new THREE.MeshStandardMaterial({ color: 0xff0000 }));
stripe.position.y = 0.6;
const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.5, 2), new THREE.MeshStandardMaterial({ color: 0x000000 }));
cabin.position.set(0, 1.1, -0.2);
const headlights = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: 0xffffff }));
headlights.position.set(0, 0.6, 2.26);
const taillights = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
taillights.position.set(0, 0.6, -2.26);
car.add(body, stripe, cabin, headlights, taillights);
scene.add(car);

// --- 5. CONTROLS & PHYSICS ---
let carPos = new THREE.Vector3(0, 0, 0);
let carAngle = 0;
let carSpeed = 0;
let camAngle = 0;
const keys = { w: false, a: false, s: false, d: false, space: false };

const overlay = document.getElementById('overlay');
overlay.addEventListener('click', () => {
  overlay.style.display = 'none';
  document.getElementById('speedo').style.display = 'block';
  renderer.domElement.requestPointerLock();
});

document.addEventListener('mousemove', (e) => {
  if (document.pointerLockElement === renderer.domElement) {
    camAngle -= e.movementX * 0.002;
  }
});

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if(k === 'w') keys.w = true; if(k === 's') keys.s = true;
  if(k === 'a') keys.a = true; if(k === 'd') keys.d = true;
  if(k === ' ') keys.space = true;
});
window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if(k === 'w') keys.w = false; if(k === 's') keys.s = false;
  if(k === 'a') keys.a = false; if(k === 'd') keys.d = false;
  if(k === ' ') keys.space = false;
});

// --- 6. MINIMAP ---
const mapCtx = document.getElementById('minimap').getContext('2d');
function drawMinimap() {
  mapCtx.clearRect(0, 0, 160, 160);
  mapCtx.fillStyle = '#222'; mapCtx.fillRect(0, 0, 160, 160);
  
  mapCtx.save();
  mapCtx.translate(80, 80);
  mapCtx.rotate(-camAngle);
  
  mapCtx.fillStyle = '#666';
  collidables.forEach(b => {
    const dx = (b.x - carPos.x) * 0.5; const dz = (b.z - carPos.z) * 0.5;
    if(Math.hypot(dx, dz) < 80) {
      mapCtx.fillRect(dx - b.r*0.5, dz - b.r*0.5, b.r, b.r);
    }
  });
  mapCtx.restore();
  
  mapCtx.fillStyle = '#00ffff';
  mapCtx.beginPath(); mapCtx.moveTo(80, 70); mapCtx.lineTo(70, 90); mapCtx.lineTo(90, 90); mapCtx.fill();
}

// --- 7. GAME LOOP ---
function animate() {
  requestAnimationFrame(animate);

  // Physics
  if (keys.w) carSpeed += 0.15; // Slow acceleration
  else if (keys.s) carSpeed -= 0.1;
  else carSpeed *= 0.95; // Friction

  if (keys.space) carSpeed *= 0.9; // Handbrake
  carSpeed = Math.max(-1, Math.min(2, carSpeed)); // Cap speed

  if (Math.abs(carSpeed) > 0.05) {
    if (keys.a) carAngle += 0.04;
    if (keys.d) carAngle -= 0.04;
  }

  let nextX = carPos.x + Math.sin(carAngle) * carSpeed;
  let nextZ = carPos.z + Math.cos(carAngle) * carSpeed;

  // Collision
  let hit = false;
  collidables.forEach(b => {
    if(Math.hypot(nextX - b.x, nextZ - b.z) < b.r) hit = true;
  });

  if (!hit) {
    carPos.x = nextX;
    carPos.z = nextZ;
  } else {
    carSpeed = -carSpeed * 0.5; // Bounce back
  }

  // Update Car
  car.position.copy(carPos);
  car.rotation.y = carAngle;

  // Camera
  const camDist = 12;
  camera.position.x = carPos.x - Math.sin(camAngle) * camDist;
  camera.position.z = carPos.z - Math.cos(camAngle) * camDist;
  camera.position.y = 5;
  camera.lookAt(carPos.x, 1, carPos.z);

  // HUD
  document.getElementById('speedo').innerHTML = Math.floor(Math.abs(carSpeed) * 50) + ' <span>KM/H</span>';
  drawMinimap();

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>

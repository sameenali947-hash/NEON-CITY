<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>VICE CITY</title>
<style>
  body{margin:0;overflow:hidden;background:#111;font-family:'Segoe UI',Arial,sans-serif;color:#fff;user-select:none}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  #speedo{position:absolute;bottom:30px;right:30px;font-size:60px;font-weight:900;color:#fff;text-shadow:0 0 20px #ff00ff, 0 0 10px #00ffff;display:none;font-style:italic;letter-spacing:-2px}
  #speedo span{font-size:18px;color:#00ffff;letter-spacing:2px}
  #minimap{position:absolute;bottom:30px;left:30px;width:160px;height:160px;border-radius:50%;border:4px solid rgba(255,255,255,0.8);background:rgba(0,0,0,0.6);box-shadow:0 0 20px rgba(0,0,0,0.5)}
  
  #overlay{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(180deg, #1a0b2e 0%, #ff00ff 100%);
    transition: opacity 0.5s; cursor:pointer;
  }
  h1{font-size:80px;margin:0;color:#fff;font-style:italic;letter-spacing:8px;text-shadow:0 0 30px #00ffff, 0 0 60px #00ffff}
  h2{font-size:20px;color:#fff;margin-top:10px;letter-spacing:2px}
</style>
</head>
<body>

<div id="hud">
  <div id="speedo">0 <span>KM/H</span></div>
  <canvas id="minimap" width="160" height="160"></canvas>
</div>

<div id="overlay">
  <h1>VICE CITY</h1>
  <h2 style="color:#0ff;">VERSION 3.0 (SUNSET EDITION)</h2>
  <p style="margin-top:20px; font-weight:bold; color:#fff;">CLICK TO DRIVE</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.1/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// --- 1. ENGINE & SUNSET SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xff7597); // Sunset Pink
scene.fog = new THREE.Fog(0xff7597, 50, 200); // Pink Fog for distance

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.6)); // Bright ambient light
const sun = new THREE.DirectionalLight(0xffaa88, 1.5); // Warm sunset light
sun.position.set(50, 100, -50);
scene.add(sun);

// --- 2. PROCEDURAL ROAD TEXTURE ---
function makeRoadTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  // Dark wet asphalt
  ctx.fillStyle = '#1a1a1f'; ctx.fillRect(0, 0, 512, 512);
  // Yellow lines
  ctx.fillStyle = '#f5b041'; ctx.fillRect(248, 0, 6, 512); ctx.fillRect(258, 0, 6, 512);
  // White dashes
  ctx.fillStyle = '#ffffff';
  for(let i=0; i<512; i+=64) { ctx.fillRect(120, i, 4, 32); ctx.fillRect(388, i, 4, 32); }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(2, 20);
  return tex;
}

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1000, 1000),
  new THREE.MeshStandardMaterial({ map: makeRoadTexture(), roughness: 0.2, metalness: 0.5 }) // Metallic makes it look slightly wet
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// --- 3. BUILD THE CITY (Neon & Palm Trees) ---
const collidables = [];
const neonColors = [0xff00ff, 0x00ffff, 0xffaa00, 0xff3300];

for(let x = -150; x <= 150; x += 60) {
  for(let z = -150; z <= 150; z += 60) {
    if(Math.abs(x) < 20 && Math.abs(z) < 20) continue; // Spawn area clear

    const h = Math.random() * 40 + 20;
    const w = Math.random() * 15 + 15;
    const d = Math.random() * 15 + 15;
    
    // Building
    const building = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshLambertMaterial({ color: 0x222233 })
    );
    building.position.set(x, h/2, z);
    scene.add(building);
    collidables.push({ x: x, z: z, r: Math.max(w, d)/2 + 2 });

    // Glowing Neon Signs
    if(Math.random() > 0.4) {
      const neon = new THREE.Mesh(
        new THREE.BoxGeometry(w+1, 2, d+1),
        new THREE.MeshBasicMaterial({ color: neonColors[Math.floor(Math.random()*4)] })
      );
      neon.position.set(x, Math.random()*h, z);
      scene.add(neon);
    }

    // Palm Trees
    if(Math.random() > 0.6) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 12), new THREE.MeshLambertMaterial({ color: 0x4a3020 }));
      trunk.position.y = 6; tree.add(trunk);
      const leafMat = new THREE.MeshLambertMaterial({ color: 0x116611, side: THREE.DoubleSide });
      for(let i=0; i<5; i++) {
        const leaf = new THREE.Mesh(new THREE.PlaneGeometry(8, 2), leafMat);
        leaf.position.y = 12; leaf.rotation.y = (i/5)*Math.PI*2; leaf.rotation.x = Math.PI/4;
        leaf.position.x = Math.cos(leaf.rotation.y)*3; leaf.position.z = Math.sin(leaf.rotation.y)*3;
        tree.add(leaf);
      }
      tree.position.set(x + w/2 + 5, 0, z + d/2 + 5);
      scene.add(tree);
    }
  }
}

// --- 4. PLAYER CAR (Detailed 3D Model) ---
const car = new THREE.Group();
// Lower Body
const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.4, 4.5), new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.8, roughness: 0.1 }));
body.position.y = 0.6;
// Sloped Hood
const hood = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.2, 1.4), new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.8, roughness: 0.1 }));
hood.position.set(0, 0.7, 1.5);
// Red Racing Stripe
const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.45, 4.5), new THREE.MeshStandardMaterial({ color: 0xff0000 }));
stripe.position.y = 0.6;
// Windshield (Black Glass)
const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.5, 2.0), new THREE.MeshStandardMaterial({ color: 0x050510, metalness: 0.9, roughness: 0.0 }));
windshield.position.set(0, 1.1, -0.2);
// Headlights (Glowing White)
const hl = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: 0xffffff }));
hl.position.set(0, 0.6, 2.26);
// Taillights (Glowing Red)
const tl = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
tl.position.set(0, 0.6, -2.26);
// Spoiler
const spoiler = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.1, 0.4), new THREE.MeshStandardMaterial({ color: 0x111111 }));
spoiler.position.set(0, 1.0, -2.1);

car.add(body, hood, stripe, windshield, hl, tl, spoiler);
scene.add(car);

// --- 5. REALISTIC PHYSICS (Using Delta Time) ---
let carPos = new THREE.Vector3(0, 0, 0);
let carAngle = 0; // Direction car is facing
let camAngle = 0; // Direction camera is looking
let currentSpeed = 0; // KM/H

const MAX_SPEED = 180; // Top speed
const ACCELERATION = 35; // How fast it speeds up
const BRAKING = 60; // How fast it stops
const FRICTION = 8; // Natural slow down
const TURN_SPEED = 1.8; // Steering sensitivity

const keys = { w: false, a: false, s: false, d: false, space: false };

const overlay = document.getElementById('overlay');
overlay.addEventListener('click', () => {
  overlay.style.display = 'none';
  document.getElementById('speedo').style.display = 'block';
  renderer.domElement.requestPointerLock();
});

document.addEventListener('mousemove', (e) => {
  if (document.pointerLockElement === renderer.domElement) {
    camAngle -= e.movementX * 0.002;
  }
});

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if(k === 'w') keys.w = true; if(k === 's') keys.s = true;
  if(k === 'a') keys.a = true; if(k === 'd') keys.d = true;
  if(k === ' ') keys.space = true;
});
window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if(k === 'w') keys.w = false; if(k === 's') keys.s = false;
  if(k === 'a') keys.a = false; if(k === 'd') keys.d = false;
  if(k === ' ') keys.space = false;
});

// --- 6. MINIMAP ---
const mapCtx = document.getElementById('minimap').getContext('2d');
function drawMinimap() {
  mapCtx.clearRect(0, 0, 160, 160);
  mapCtx.fillStyle = '#222'; mapCtx.fillRect(0, 0, 160, 160);
  
  mapCtx.save();
  mapCtx.translate(80, 80);
  mapCtx.rotate(-camAngle); // Rotate map with camera
  
  mapCtx.fillStyle = '#555';
  collidables.forEach(b => {
    const dx = (b.x - carPos.x) * 0.5; const dz = (b.z - carPos.z) * 0.5;
    if(Math.hypot(dx, dz) < 80) {
      mapCtx.fillRect(dx - b.r*0.5, dz - b.r*0.5, b.r, b.r);
    }
  });
  mapCtx.restore();
  
  // Player Arrow
  mapCtx.fillStyle = '#00ffff';
  mapCtx.beginPath(); mapCtx.moveTo(80, 70); mapCtx.lineTo(70, 90); mapCtx.lineTo(90, 90); mapCtx.fill();
}

// --- 7. GAME LOOP WITH DELTA TIME ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  
  // Delta Time ensures the car accelerates at the same speed on any computer
  const dt = Math.min(clock.getDelta(), 0.1); 

  // 1. Acceleration & Braking
  if (keys.w) {
    currentSpeed += ACCELERATION * dt;
  } else if (keys.s) {
    currentSpeed -= BRAKING * dt;
  } else {
    // Natural friction (slow down)
    if (currentSpeed > 0) currentSpeed -= FRICTION * dt;
    if (currentSpeed < 0) currentSpeed += FRICTION * dt;
  }

  // Handbrake (Space)
  if (keys.space) {
    currentSpeed *= 0.92; // Strong friction
  }

  // Cap Top Speed
  currentSpeed = Math.max(-MAX_SPEED/2, Math.min(MAX_SPEED, currentSpeed));

  // 2. Steering (Only turn if moving)
  if (Math.abs(currentSpeed) > 5) {
    const turnMultiplier = Math.min(Math.abs(currentSpeed) / 40, 1); // Harder to turn at high speed
    if (keys.a) carAngle += TURN_SPEED * turnMultiplier * dt;
    if (keys.d) carAngle -= TURN_SPEED * turnMultiplier * dt;
  }

  // 3. Calculate Next Position
  let nextX = carPos.x + Math.sin(carAngle) * currentSpeed * dt;
  let nextZ = carPos.z + Math.cos(carAngle) * currentSpeed * dt;

  // 4. Collision Detection
  let hit = false;
  collidables.forEach(b => {
    if(Math.hypot(nextX - b.x, nextZ - b.z) < b.r) hit = true;
  });

  if (!hit) {
    carPos.x = nextX;
    carPos.z = nextZ;
  } else {
    // Bounce back and lose speed
    currentSpeed = -currentSpeed * 0.3;
  }

  // 5. Update Car Mesh
  car.position.copy(carPos);
  car.rotation.y = carAngle;

  // 6. Camera Follow (Spring Arm)
  const camDist = 10;
  camera.position.x = carPos.x - Math.sin(camAngle) * camDist;
  camera.position.z = carPos.z - Math.cos(camAngle) * camDist;
  camera.position.y = 5;
  camera.lookAt(carPos.x, 1, carPos.z);

  // 7. HUD & Minimap
  document.getElementById('speedo').innerHTML = Math.floor(Math.abs(currentSpeed)) + ' <span>KM/H</span>';
  drawMinimap();

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>VICE CITY - LEONIDA</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',Arial,sans-serif;color:#fff;user-select:none}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  
  /* HUD Elements */
  #topRight{position:absolute;top:20px;right:20px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  #wanted{display:flex;gap:4px;font-size:28px;color:rgba(255,255,255,0.2);text-shadow:0 2px 5px #000}
  .star.active{color:#ffcc00;text-shadow:0 0 10px #ffcc00, 0 0 20px #ffaa00}
  #cash{font-size:36px;font-weight:900;color:#7dfba0;text-shadow:0 2px 10px rgba(0,0,0,0.8),0 0 10px #7dfba0;font-style:italic}
  
  #topLeft{position:absolute;top:20px;left:20px;display:flex;flex-direction:column;gap:6px}
  .barWrap{width:180px;height:12px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.3);border-radius:6px;overflow:hidden}
  .barFill{height:100%;width:100%;transition:width 0.2s}
  #hpBar{background:linear-gradient(90deg,#ff0055,#ff00aa)}
  #arBar{background:linear-gradient(90deg,#00ccff,#0066ff)}

  /* Speedo */
  #speedo{position:absolute;bottom:20px;right:200px;font-size:50px;font-weight:900;display:none;text-shadow:0 0 20px #00ffff,0 2px 5px #000;font-style:italic;color:#fff}
  #speedo span{font-size:16px;color:#00ffff;letter-spacing:2px}

  /* Minimap */
  #minimapWrap{position:absolute;bottom:20px;left:20px;width:160px;height:160px;border-radius:50%;border:3px solid rgba(255,255,255,0.4);overflow:hidden;box-shadow:0 0 20px rgba(0,0,0,0.8);background:#111}
  #minimap{width:100%;height:100%}

  /* Overlay */
  #overlay{position:fixed;inset:0;background:linear-gradient(135deg,rgba(20,0,40,0.95),rgba(0,20,40,0.95));backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;cursor:pointer;transition:opacity 0.5s}
  #overlay.hidden{opacity:0;pointer-events:none}
  h1{font-size:80px;margin-bottom:5px;color:#ff00ff;text-shadow:0 0 30px #ff00ff,0 0 10px #fff;font-style:italic;letter-spacing:4px}
  h2{font-size:20px;color:#00ffff;text-shadow:0 0 10px #00ffff;letter-spacing:8px;margin-bottom:40px}
  .controls{background:rgba(0,0,0,0.5);padding:20px 40px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);text-align:left;line-height:1.8;font-size:16px;color:#ccc}
  .controls b{color:#fff;display:inline-block;width:100px}
  .playBtn{margin-top:30px;padding:15px 60px;font-size:24px;font-weight:bold;color:#fff;background:linear-gradient(90deg,#ff00ff,#00ffff);border:none;border-radius:30px;cursor:pointer;box-shadow:0 0 20px rgba(255,0,255,0.5);letter-spacing:2px}
</style>
</head>
<body>

<div id="hud">
  <div id="topLeft">
    <div class="barWrap"><div id="hpBar" class="barFill"></div></div>
    <div class="barWrap"><div id="arBar" class="barFill"></div></div>
  </div>
  <div id="topRight">
    <div id="wanted">
      <div class="star">★</div><div class="star">★</div><div class="star">★</div><div class="star">★</div><div class="star">★</div>
    </div>
    <div id="cash">$0</div>
  </div>
  <div id="speedo">0 <span>MPH</span></div>
  <div id="minimapWrap">
    <canvas id="minimap" width="160" height="160"></canvas>
  </div>
</div>

<div id="overlay">
  <h1>LEONIDA</h1>
  <h2>VICE PROTOTYPE</h2>
  <div class="controls">
    <div><b>WASD</b> Move / Drive</div>
    <div><b>Shift</b> Sprint</div>
    <div><b>Space</b> Jump / Handbrake</div>
    <div><b>F</b> Enter / Exit Vehicle</div>
    <div><b>Mouse</b> Look / Aim</div>
    <div><b>Left Click</b> Shoot</div>
  </div>
  <button class="playBtn">PLAY</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.1/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// --- 1. SETUP & UTILS ---
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a0b2e, 0.0028);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Sky Gradient
const skyGeo = new THREE.SphereGeometry(500, 32, 15);
const skyMat = new THREE.ShaderMaterial({
  uniforms: { top: { value: new THREE.Color(0x1a0b2e) }, bottom: { value: new THREE.Color(0xff7e5f) } },
  vertexShader: `varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 top; uniform vec3 bottom; varying vec3 vPos; void main(){ float h = normalize(vPos).y; gl_FragColor = vec4(mix(bottom, top, max(pow(max(h,0.0),0.6),0.0)),1.0); }`,
  side: THREE.BackSide
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// Lighting
scene.add(new THREE.HemisphereLight(0xff9a9e, 0x2b1055, 0.6));
const sun = new THREE.DirectionalLight(0xff7e5f, 1.5);
sun.position.set(-100, 80, -100);
sun.castShadow = true;
sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;
sun.shadow.camera.left = -150; sun.shadow.camera.right = 150;
sun.shadow.camera.top = 150; sun.shadow.camera.bottom = -150;
scene.add(sun);

// --- 2. PROCEDURAL TEXTURES ---
function createCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// Asphalt Texture
const roadCanvas = createCanvas(512, 512);
const rctx = roadCanvas.getContext('2d');
rctx.fillStyle = '#222428'; rctx.fillRect(0, 0, 512, 512);
for(let i=0; i<20000; i++) {
  rctx.fillStyle = Math.random()>0.5 ? 'rgba(255,255,255,0.02)' : 'rgba(0,0,0,0.1)';
  rctx.fillRect(Math.random()*512, Math.random()*512, 2, 2);
}
// Double Yellow
rctx.fillStyle = '#f5b041'; rctx.fillRect(250, 0, 4, 512); rctx.fillRect(258, 0, 4, 512);
// White Dashed
rctx.fillStyle = '#ffffff';
for(let y=0; y<512; y+=64) { rctx.fillRect(128, y, 4, 32); rctx.fillRect(384, y, 4, 32); }
const roadTex = new THREE.CanvasTexture(roadCanvas);
roadTex.wrapS = roadTex.wrapT = THREE.RepeatWrapping; roadTex.repeat.set(1, 4); roadTex.anisotropy = 8;

// Building Textures
function makeBuildingTex(color, isLit) {
  const c = createCanvas(256, 512); const ctx = c.getContext('2d');
  ctx.fillStyle = color; ctx.fillRect(0, 0, 256, 512);
  for(let y=20; y<480; y+=40) {
    for(let x=20; x<220; x+=40) {
      ctx.fillStyle = (isLit && Math.random()>0.4) ? '#ffeaa7' : '#111';
      ctx.fillRect(x, y, 20, 25);
    }
  }
  return new THREE.CanvasTexture(c);
}
const bTex1 = makeBuildingTex('#2d1b4e', true);
const bTex2 = makeBuildingTex('#1b2a4e', true);
const bTex3 = makeBuildingTex('#4e1b2a', false);
const bTex4 = makeBuildingTex('#1b4e2a', true);

// Sand
const sandCanvas = createCanvas(256, 256); const sctx = sandCanvas.getContext('2d');
sctx.fillStyle = '#d4b57e'; sctx.fillRect(0, 0, 256, 256);
for(let i=0; i<5000; i++) { sctx.fillStyle = Math.random()>0.5?'#e6cc99':'#b39761'; sctx.fillRect(Math.random()*256, Math.random()*256, 2, 2); }
const sandTex = new THREE.CanvasTexture(sandCanvas);
sandTex.wrapS = sandTex.wrapT = THREE.RepeatWrapping; sandTex.repeat.set(10, 10);

// --- 3. WORLD GENERATION ---
const collidables = []; // AABB boxes
const mapSize = 800; const cell = 76; // 60 block + 16 road

// Ground (City)
const cityGround = new THREE.Mesh(new THREE.PlaneGeometry(500, mapSize), new THREE.MeshLambertMaterial({ color: 0x1a1a1a }));
cityGround.rotation.x = -Math.PI/2; cityGround.position.set(-150, 0, 0); cityGround.receiveShadow = true;
scene.add(cityGround);

// Roads & Sidewalks
for(let x = -300; x <= 100; x += cell) {
  for(let z = -300; z <= 300; z += cell) {
    // Horizontal Road
    const roadH = new THREE.Mesh(new THREE.PlaneGeometry(mapSize, 16), new THREE.MeshLambertMaterial({ map: roadTex }));
    roadH.rotation.x = -Math.PI/2; roadH.position.set(-150, 0.01, z); scene.add(roadH);
    // Vertical Road
    const roadV = new THREE.Mesh(new THREE.PlaneGeometry(16, mapSize), new THREE.MeshLambertMaterial({ map: roadTex }));
    roadV.rotation.x = -Math.PI/2; roadV.position.set(x, 0.02, 0); roadV.rotation.z = Math.PI/2; scene.add(roadV);
    
    // Buildings
    if (x !== 100 && z !== 300) { // Skip rightmost/backmost for beach
      const bw = Math.random() * 20 + 30; const bd = Math.random() * 20 + 30;
      const bh = Math.random() * 55 + 18;
      const tex = [bTex1, bTex2, bTex3, bTex4][Math.floor(Math.random()*4)];
      const bMesh = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), new THREE.MeshLambertMaterial({ map: tex, emissiveMap: tex, emissive: 0xffffff, emissiveIntensity: 0.2 }));
      bMesh.position.set(x + 38, bh/2 + 0.25, z + 38);
      bMesh.castShadow = true; bMesh.receiveShadow = true;
      scene.add(bMesh);
      collidables.push({ x: bMesh.position.x, z: bMesh.position.z, w: bw, d: bd, h: bh });
      
      // Sidewalk
      const sw = new THREE.Mesh(new THREE.BoxGeometry(60, 0.25, 60), new THREE.MeshLambertMaterial({ color: 0x888888 }));
      sw.position.set(x + 38, 0.125, z + 38); sw.receiveShadow = true; scene.add(sw);
    }
  }
}

// Beach & Ocean
const beach = new THREE.Mesh(new THREE.PlaneGeometry(300, mapSize), new THREE.MeshLambertMaterial({ map: sandTex }));
beach.rotation.x = -Math.PI/2; beach.position.set(250, -0.1, 0); beach.receiveShadow = true; scene.add(beach);
// Ocean
const oceanGeo = new THREE.PlaneGeometry(200, mapSize, 10, 10);
const oceanMat = new THREE.MeshPhongMaterial({ color: 0x00aaff, transparent: true, opacity: 0.8, shininess: 100 });
const ocean = new THREE.Mesh(oceanGeo, oceanMat);
ocean.rotation.x = -Math.PI/2; ocean.position.set(450, -0.3, 0); scene.add(ocean);

// Palm Trees & Lights
function createPalmTree(x, z) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 12, 6), new THREE.MeshLambertMaterial({ color: 0x5c4033 }));
  trunk.position.y = 6; trunk.rotation.z = 0.1; g.add(trunk);
  const leafMat = new THREE.MeshLambertMaterial({ color: 0x116611, side: THREE.DoubleSide });
  for(let i=0; i<6; i++) {
    const leaf = new THREE.Mesh(new THREE.PlaneGeometry(8, 2), leafMat);
    leaf.position.y = 12; leaf.rotation.y = (i/6)*Math.PI*2; leaf.rotation.x = Math.PI/4;
    leaf.position.x = Math.cos(leaf.rotation.y)*3; leaf.position.z = Math.sin(leaf.rotation.y)*3;
    g.add(leaf);
  }
  g.position.set(x, 0, z); scene.add(g);
}
function createLamp(x, z) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 6), new THREE.MeshLambertMaterial({ color: 0x333333 }));
  pole.position.y = 3; g.add(pole);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshBasicMaterial({ color: 0xffdd88 }));
  bulb.position.y = 6; g.add(bulb);
  const light = new THREE.PointLight(0xffdd88, 1, 20); light.position.y = 6; g.add(light);
  g.position.set(x, 0, z); scene.add(g);
}
for(let z = -350; z <= 350; z += 40) {
  createPalmTree(90, z);
  createPalmTree(120, z + 20);
  if(z % 80 === 0) createLamp(85, z);
}

// --- 4. ENTITIES & PHYSICS ---
const player = { pos: new THREE.Vector3(0,0,0), vel: new THREE.Vector3(), angle: 0, hp: 100, armor: 100, inCar: null, cash: 0, wanted: 0, wantedTimer: 0 };
const playerMesh = new THREE.Group();
const bodyMat = new THREE.MeshLambertMaterial({ color: 0x22aa22 });
const skinMat = new THREE.MeshLambertMaterial({ color: 0xffccaa });
const torso = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.5), bodyMat); torso.position.y = 0.75;
const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), skinMat); head.position.y = 1.8;
playerMesh.add(torso, head); playerMesh.castShadow = true; scene.add(playerMesh);

const cars = []; // { group, type, speed, angle, pos, isPolice, lights[] }
const peds = []; // { mesh, pos, angle, speed, panic }

// Factory for Vehicles
function spawnCar(x, z, isPolice = false) {
  const g = new THREE.Group();
  const isSuper = !isPolice && Math.random() > 0.5;
  const color = isPolice ? 0x111111 : (isSuper ? 0xff0000 : 0x4444ff);
  const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 4.2), new THREE.MeshPhongMaterial({ color, shininess: 80 }));
  body.position.y = 0.5; body.castShadow = true; g.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 2), new THREE.MeshLambertMaterial({ color: 0x000000 }));
  cabin.position.set(0, 1.0, -0.2); g.add(cabin);
  
  const lights = [];
  if(isPolice) {
    const rLight = new THREE.PointLight(0xff0000, 2, 15); rLight.position.set(0.5, 1.4, 0);
    const bLight = new THREE.PointLight(0x0000ff, 2, 15); bLight.position.set(-0.5, 1.4, 0);
    g.add(rLight, bLight); lights.push(rLight, bLight);
  }
  
  g.position.set(x, 0.2, z); scene.add(g);
  const car = { group: g, pos: g.position, angle: Math.random()*Math.PI*2, speed: isPolice ? 0 : Math.random()*10+10, isPolice, lights, maxSpeed: isSuper ? 58 : 42, turnRate: isSuper ? 2.4 : 2.0, w: 2, d: 4.2 };
  cars.push(car); return car;
}

// Spawn Traffic
for(let i=0; i<22; i++) {
  const isX = Math.random() > 0.5;
  spawnCar(isX ? Math.random()*400-300 : 0, isX ? 0 : Math.random()*600-300);
}

// Factory for Pedestrians
function spawnPed(x, z) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.4, 0.4), new THREE.MeshLambertMaterial({ color: Math.random()*0xffffff }));
  b.position.y = 0.7; b.castShadow = true;
  const h = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), skinMat);
  h.position.y = 1.6;
  g.add(b, h); g.position.set(x, 0, z); scene.add(g);
  peds.push({ group: g, pos: g.position, angle: Math.random()*Math.PI*2, speed: 2, panic: false, alive: true });
}
for(let i=0; i<45; i++) spawnPed(Math.random()*400-300, Math.random()*600-300);

// --- 5. INPUTS & AUDIO ---
const keys = { w: false, a: false, s: false, d: false, shift: false, space: false, f: false };
let mouseX = 0, camAngle = 0, pointerLocked = false;
const overlay = document.getElementById('overlay');
const ctx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
  if(ctx.state === 'suspended') ctx.resume();
  const osc = ctx.createOscillator(); const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  if(type === 'shot') {
    osc.type = 'square'; osc.frequency.setValueAtTime(300, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
    osc.start(); osc.stop(ctx.currentTime + 0.1);
  } else if(type === 'siren') {
    osc.type = 'sine'; osc.frequency.setValueAtTime(650, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(850, ctx.currentTime + 0.5);
    osc.frequency.linearRampToValueAtTime(650, ctx.currentTime + 1.0);
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    osc.start(); osc.stop(ctx.currentTime + 1.0);
  }
}

overlay.addEventListener('click', () => {
  overlay.classList.add('hidden');
  renderer.domElement.requestPointerLock();
  if(ctx.state === 'suspended') ctx.resume();
});
document.addEventListener('pointerlockchange', () => { pointerLocked = document.pointerLockElement === renderer.domElement; });
document.addEventListener('mousemove', e => { if(pointerLocked) camAngle -= e.movementX * 0.002; });
window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });
document.addEventListener('mousedown', e => { if(e.button === 0 && pointerLocked && !player.inCar) shoot(); });

// --- 6. GAMEPLAY LOGIC ---
function shoot() {
  playSound('shot');
  if(player.wanted < 1) player.wanted = 1;
  const ray = new THREE.Raycaster(new THREE.Vector3(player.pos.x, 1.5, player.pos.z), new THREE.Vector3(Math.sin(camAngle), 0, Math.cos(camAngle)));
  // Simple hit check
  peds.forEach(p => {
    if(p.alive && ray.ray.distanceToPoint(p.pos) < 1.5) {
      p.alive = false; p.group.rotation.x = -Math.PI/2; p.group.position.y = 0.2;
      player.cash += 50; player.wanted = Math.min(5, player.wanted + 1);
    }
  });
}

function enterExitCar() {
  if(player.inCar) {
    player.inCar = null; player.pos.copy(playerMesh.position); playerMesh.visible = true;
    document.getElementById('speedo').style.display = 'none';
  } else {
    let nearest = null; let minD = 5;
    cars.forEach(c => { const d = player.pos.distanceTo(c.pos); if(d < minD) { minD = d; nearest = c; } });
    if(nearest) {
      player.inCar = nearest; playerMesh.visible = false;
      document.getElementById('speedo').style.display = 'block';
    }
  }
}

// Collision Check
function checkCollisions(x, z, radius) {
  for(let b of collidables) {
    if(Math.abs(x - b.x) < (b.w/2 + radius) && Math.abs(z - b.z) < (b.d/2 + radius)) return true;
  }
  return false;
}

// --- 7. UPDATE LOOP ---
const clock = new THREE.Clock();
let policeSirenTimer = 0;

function update() {
  const dt = Math.min(clock.getDelta(), 0.1);
  
  // Ocean Animation
  const positions = oceanGeo.attributes.position.array;
  for(let i=0; i<positions.length; i+=3) {
    positions[i+2] = Math.sin(clock.elapsedTime * 2 + positions[i]) * 1.5;
  }
  oceanGeo.attributes.position.needsUpdate = true;

  // Player / Car Logic
  if(player.inCar) {
    const c = player.inCar;
    // Acceleration
    if(keys.w) c.speed += 30 * dt;
    else if(keys.s) c.speed -= 30 * dt;
    else c.speed *= 0.98;
    
    // Handbrake
    if(keys.space) c.speed *= 0.9;
    c.speed = THREE.MathUtils.clamp(c.speed, -20, c.maxSpeed);
    
    // Steering
    if(Math.abs(c.speed) > 0.5) {
      if(keys.a) c.angle += c.turnRate * dt * Math.sign(c.speed);
      if(keys.d) c.angle -= c.turnRate * dt * Math.sign(c.speed);
    }
    
    // Move
    const nx = c.pos.x + Math.sin(c.angle) * c.speed * dt;
    const nz = c.pos.z + Math.cos(c.angle) * c.speed * dt;
    if(!checkCollisions(nx, nz, 2)) { c.pos.x = nx; c.pos.z = nz; }
    else c.speed *= -0.5; // Bounce
    
    c.group.rotation.y = c.angle;
    player.pos.copy(c.pos);
    
    // Police lights
    if(c.isPolice && c.lights.length) {
      const flash = Math.floor(clock.elapsedTime * 10) % 2 === 0;
      c.lights[0].intensity = flash ? 5 : 0;
      c.lights[1].intensity = flash ? 0 : 5;
    }
  } else {
    // On Foot
    const speed = keys.shift ? 14 : 7;
    let dx = 0, dz = 0;
    if(keys.w) { dx += Math.sin(camAngle); dz += Math.cos(camAngle); }
    if(keys.s) { dx -= Math.sin(camAngle); dz -= Math.cos(camAngle); }
    if(keys.a) { dx += Math.sin(camAngle - Math.PI/2); dz += Math.cos(camAngle - Math.PI/2); }
    if(keys.d) { dx += Math.sin(camAngle + Math.PI/2); dz += Math.cos(camAngle + Math.PI/2); }
    
    const len = Math.hypot(dx, dz);
    if(len > 0) {
      dx /= len; dz /= len;
      const nx = player.pos.x + dx * speed * dt;
      const nz = player.pos.z + dz * speed * dt;
      if(!checkCollisions(nx, nz, 1)) { player.pos.x = nx; player.pos.z = nz; }
      
      // Walk cycle
      torso.position.y = 0.75 + Math.sin(clock.elapsedTime * speed) * 0.05;
      playerMesh.rotation.y = Math.atan2(dx, dz);
    }
  }

  // Enter/Exit
  if(keys.f) { enterExitCar(); keys.f = false; }

  // Sync Player Mesh
  if(!player.inCar) { playerMesh.position.copy(player.pos); }

  // Camera
  const camDist = player.inCar ? 11 : 8;
  const camHeight = player.inCar ? 4.5 : 3.5;
  const targetCam = new THREE.Vector3(
    player.pos.x - Math.sin(camAngle) * camDist,
    player.pos.y + camHeight,
    player.pos.z - Math.cos(camAngle) * camDist
  );
  camera.position.lerp(targetCam, 10 * dt);
  camera.lookAt(player.pos.x, player.pos.y + 1.5, player.pos.z);

  // Update AI Traffic
  cars.forEach(c => {
    if(c === player.inCar) return;
    if(c.isPolice) {
      // Chase player
      const dx = player.pos.x - c.pos.x; const dz = player.pos.z - c.pos.z;
      const dist = Math.hypot(dx, dz);
      if(dist < 120) {
        c.angle = Math.atan2(dx, dz);
        c.speed = c.maxSpeed;
        if(dist < 10) { // Ram / Damage
          player.hp -= 10 * dt;
          c.speed = -10;
        }
      }
    }
    
    // Move AI
    c.pos.x += Math.sin(c.angle) * c.speed * dt;
    c.pos.z += Math.cos(c.angle) * c.speed * dt;
    c.group.rotation.y = c.angle;
    
    // Simple bound wrap
    if(c.pos.x > 400) c.pos.x = -400; if(c.pos.x < -400) c.pos.x = 400;
    if(c.pos.z > 400) c.pos.z = -400; if(c.pos.z < -400) c.pos.z = 400;
  });

  // Update Peds
  peds.forEach(p => {
    if(!p.alive) return;
    p.pos.x += Math.sin(p.angle) * p.speed * dt * (p.panic ? 3 : 1);
    p.pos.z += Math.cos(p.angle) * p.speed * dt * (p.panic ? 3 : 1);
    p.group.position.copy(p.pos);
    p.group.rotation.y = p.angle;
    if(Math.random() < 0.01) p.angle += (Math.random()-0.5);
  });

  // Wanted System
  if(player.wanted > 0) {
    player.wantedTimer += dt;
    if(player.wantedTimer > 15) {
      player.wanted--; player.wantedTimer = 0;
      document.querySelectorAll('.star')[player.wanted].classList.remove('active');
    }
    // Spawn Police
    if(cars.filter(c=>c.isPolice).length < player.wanted * 2) {
      const ang = Math.random() * Math.PI * 2;
      spawnCar(player.pos.x + Math.sin(ang)*150, player.pos.z + Math.cos(ang)*150, true);
    }
    // Siren
    policeSirenTimer += dt;
    if(policeSirenTimer > 1) { playSound('siren'); policeSirenTimer = 0; }
  }

  // HUD Update
  document.getElementById('hpBar').style.width = Math.max(0, player.hp) + '%';
  document.getElementById('cash').innerText = '$' + player.cash;
  if(player.inCar) document.getElementById('speedo').innerHTML = Math.floor(Math.abs(player.inCar.speed) * 2.2) + ' <span>MPH</span>';
}

// --- 8. MINIMAP ---
const mapCanvas = document.getElementById('minimap');
const mapCtx = mapCanvas.getContext('2d');

function drawMinimap() {
  mapCtx.clearRect(0, 0, 160, 160);
  mapCtx.save();
  mapCtx.translate(80, 80);
  mapCtx.rotate(-camAngle);
  
  // Draw Roads
  mapCtx.strokeStyle = 'rgba(255,255,255,0.2)'; mapCtx.lineWidth = 4;
  for(let i=-300; i<=100; i+=76) {
    mapCtx.beginPath(); mapCtx.moveTo(i, -400); mapCtx.lineTo(i, 400); mapCtx.stroke();
    mapCtx.beginPath(); mapCtx.moveTo(-400, i); mapCtx.lineTo(400, i); mapCtx.stroke();
  }
  
  // Draw Cars
  cars.forEach(c => {
    const dx = (c.pos.x - player.pos.x) * 0.5; const dz = (c.pos.z - player.pos.z) * 0.5;
    if(Math.hypot(dx, dz) < 80) {
      mapCtx.fillStyle = c.isPolice ? (Math.floor(clock.elapsedTime*10)%2===0?'#ff0000':'#0000ff') : '#ffffff';
      mapCtx.beginPath(); mapCtx.arc(dx, dz, 2, 0, Math.PI*2); mapCtx.fill();
    }
  });
  
  mapCtx.restore();
  
  // Player Arrow
  mapCtx.fillStyle = '#00ffff';
  mapCtx.beginPath();
  mapCtx.moveTo(80, 75); mapCtx.lineTo(75, 85); mapCtx.lineTo(85, 85);
  mapCtx.fill();
}

// --- 9. LOOP WITH TRY/CATCH ---
function animate() {
  requestAnimationFrame(animate);
  try {
    update();
    drawMinimap();
    renderer.render(scene, camera);
  } catch (e) {
    console.error("Frame error:", e);
  }
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>VICE CITY</title>
<style>
  body{margin:0;overflow:hidden;background:#000;font-family:sans-serif;color:#fff;user-select:none}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  #speedo{position:absolute;bottom:20px;left:20px;font-size:60px;font-weight:bold;color:#fff;text-shadow:0 0 15px #ff00ff;display:none;font-style:italic}
  #speedo span{font-size:20px;color:#0ff;text-shadow:0 0 10px #0ff}
  #overlay{position:fixed;inset:0;background:linear-gradient(to bottom, #2a0845, #ff7597);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;cursor:pointer}
  h1{font-size:80px;margin:0 0 10px;color:#fff;text-shadow:0 0 30px #ff00ff, 0 0 10px #fff;font-style:italic;letter-spacing:5px}
  p{font-size:24px;color:#0ff;text-shadow:0 0 10px #0ff}
</style>
</head>
<body>
<div id="hud"><div id="speedo">0 <span>MPH</span></div></div>
<div id="overlay"><h1>VICE CITY</h1><p>Click to drive</p></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// 1. Scene Setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xff7597); // Sunset pink
scene.fog = new THREE.Fog(0xff7597, 50, 400);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// 2. Lights (Bright so you can see)
scene.add(new THREE.AmbientLight(0xffffff, 0.8)); // Bright ambient light
const sun = new THREE.DirectionalLight(0xffaa88, 2.0);
sun.position.set(50, 100, 50);
sun.castShadow = true;
sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;
scene.add(sun);

// 3. Physics World
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -20, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);

// 4. Ground & Ocean
const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333 }); // Grey road
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), quaternion: new CANNON.Quaternion().setFromEuler(-Math.PI/2, 0, 0) }));

// Water
const water = new THREE.Mesh(new THREE.PlaneGeometry(300, 1000), new THREE.MeshStandardMaterial({ color: 0x112244 }));
water.rotation.x = -Math.PI/2; water.position.set(-200, 0.1, 0);
scene.add(water);

// 5. City Generation (Buildings + Palms + Neon)
const neonColors = [0xff00ff, 0x00ffff, 0xffaa00];
for(let x = -150; x <= 150; x += 40) {
  for(let z = -150; z <= 150; z += 40) {
    if(Math.abs(x) < 20 && Math.abs(z) < 20) continue; // Clear spawn
    
    // Building
    const h = Math.random() * 50 + 20;
    const b = new THREE.Mesh(new THREE.BoxGeometry(15, h, 15), new THREE.MeshStandardMaterial({ color: 0x222233 }));
    b.position.set(x, h/2, z); b.castShadow = true; b.receiveShadow = true;
    scene.add(b);
    world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(7.5, h/2, 7.5)), position: new CANNON.Vec3(x, h/2, z) }));

    // Bright Neon Strip
    if(Math.random() > 0.3) {
      const neon = new THREE.Mesh(new THREE.BoxGeometry(15.5, 2, 15.5), new THREE.MeshBasicMaterial({ color: neonColors[Math.floor(Math.random()*3)] }));
      neon.position.set(x, Math.random()*h, z);
      scene.add(neon);
    }

    // Palm Tree
    if(Math.random() > 0.5) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 10), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
      trunk.position.y = 5; tree.add(trunk);
      const leaves = new THREE.MeshStandardMaterial({ color: 0x116611, side: THREE.DoubleSide });
      for(let l=0; l<4; l++) {
        const leaf = new THREE.Mesh(new THREE.PlaneGeometry(6, 1.5), leaves);
        leaf.position.y = 10; leaf.rotation.y = (l/4)*Math.PI*2; leaf.rotation.x = Math.PI/4;
        leaf.position.x = Math.cos(leaf.rotation.y)*3; leaf.position.z = Math.sin(leaf.rotation.y)*3;
        tree.add(leaf);
      }
      tree.position.set(x + 12, 0, z + 12);
      scene.add(tree);
    }
  }
}

// 6. Player Car (White with Red Stripe)
const carGroup = new THREE.Group();
const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.6, 4.5), new THREE.MeshStandardMaterial({ color: 0xffffff }));
bodyMesh.position.y = 0.6; bodyMesh.castShadow = true;
const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.61, 4.5), new THREE.MeshStandardMaterial({ color: 0xff0000 }));
stripe.position.y = 0.6;
const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 2), new THREE.MeshStandardMaterial({ color: 0x000000 }));
cabin.position.set(0, 1.2, -0.2);
const lightL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.1), new THREE.MeshBasicMaterial({ color: 0xffffff }));
lightL.position.set(0.7, 0.6, 2.25);
const lightR = lightL.clone(); lightR.position.x = -0.7;
carGroup.add(bodyMesh, stripe, cabin, lightL, lightR);
scene.add(carGroup);

// Car Physics
const carBody = new CANNON.Body({ mass: 150, linearDamping: 0.8 }); // High damping for grip
carBody.addShape(new CANNON.Box(new CANNON.Vec3(1.1, 0.3, 2.25)));
carBody.position.set(0, 2, 0);
world.addBody(carBody);

// 7. Controls
const keys = { w: false, a: false, s: false, d: false };
let camAngle = Math.PI;
const overlay = document.getElementById('overlay');

overlay.addEventListener('click', () => {
  overlay.style.display = 'none';
  document.getElementById('speedo').style.display = 'block';
  renderer.domElement.requestPointerLock();
});

document.addEventListener('mousemove', (e) => { 
  if (document.pointerLockElement === renderer.domElement) camAngle -= e.movementX * 0.002; 
});

// Bulletproof Keyboard Events
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (['w', 'a', 's', 'd'].includes(k)) keys[k] = true;
});
window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (['w', 'a', 's', 'd'].includes(k)) keys[k] = false;
});

// 8. Game Loop
const clock = new THREE.Clock();
const forceVec = new CANNON.Vec3();
const forward = new CANNON.Vec3();

function animate() {
  requestAnimationFrame(animate);
  world.step(1/60, Math.min(clock.getDelta(), 0.1), 3);

  // Sync mesh to physics body
  carGroup.position.copy(carBody.position);
  carGroup.quaternion.copy(carBody.quaternion);

  // Keep car flat (no flipping)
  carBody.angularVelocity.x = 0;
  carBody.angularVelocity.z = 0;
  carBody.quaternion.setFromEuler(0, carBody.quaternion.toEuler().y, 0);

  // Driving logic using ApplyForce
  forward.set(0, 0, 1);
  carBody.quaternion.vmult(forward, forward);
  
  if (keys.w) { 
    forward.scale(3000, forceVec); 
    carBody.applyForce(forceVec, carBody.position); 
  }
  if (keys.s) { 
    forward.scale(-2000, forceVec); 
    carBody.applyForce(forceVec, carBody.position); 
  }
  
  // Steering
  if (keys.a) carBody.angularVelocity.y = 2.5;
  else if (keys.d) carBody.angularVelocity.y = -2.5;
  else carBody.angularVelocity.y = 0;

  // Camera
  const camDist = 10;
  camera.position.x = carBody.position.x - Math.sin(camAngle) * camDist;
  camera.position.z = carBody.position.z - Math.cos(camAngle) * camDist;
  camera.position.y = carBody.position.y + 4;
  camera.lookAt(carBody.position.x, carBody.position.y + 1, carBody.position.z);

  // HUD
  document.getElementById('speedo').innerHTML = Math.floor(carBody.velocity.length() * 2.2) + ' <span>MPH</span>';

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>VICE CITY - LEONIDA</title>
<style>
  body{margin:0;overflow:hidden;background:#000;font-family:'Segoe UI',Arial,sans-serif;color:#fff;user-select:none}
  
  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  #speedo{position:absolute;bottom:30px;right:30px;font-size:70px;font-weight:900;color:#fff;text-shadow:0 0 20px #ff00ff, 0 0 10px #00ffff;display:none;font-style:italic;letter-spacing:-2px}
  #speedo span{font-size:20px;color:#00ffff;letter-spacing:2px}
  #minimap{position:absolute;bottom:30px;left:30px;width:180px;height:180px;border-radius:50%;border:4px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.7);box-shadow:0 0 30px rgba(255,0,255,0.3)}

  /* START SCREEN */
  #overlay{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(180deg, #1a0b2e 0%, #ff00ff 100%);
    transition: opacity 0.5s; cursor: pointer;
  }
  h1{font-size:90px;margin:0;color:#fff;font-style:italic;letter-spacing:8px;text-shadow:0 0 30px #00ffff, 0 0 60px #00ffff}
  p{font-size:24px;color:#00ffff;text-shadow:0 0 10px #00ffff;letter-spacing:4px;margin-top:10px;font-weight:bold}
  .btn{margin-top:40px;padding:15px 60px;font-size:24px;font-weight:900;color:#000;background:#00ffff;border-radius:30px;box-shadow:0 0 30px #00ffff}
</style>
</head>
<body>

<div id="hud">
  <div id="speedo">0 <span>MPH</span></div>
  <canvas id="minimap" width="180" height="180"></canvas>
</div>

<div id="overlay">
  <h1>VICE CITY</h1>
  <p>LEONIDA PROTOTYPE</p>
  <div class="btn">CLICK TO PLAY</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.1/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// 1. ENGINE SETUP
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0514); // Deep night sky
scene.fog = new THREE.FogExp2(0x0a0514, 0.015); // Atmospheric night fog

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// 2. LIGHTING (Neon Night Vibe)
scene.add(new THREE.AmbientLight(0xffffff, 0.4)); // Dim ambient
const moonlight = new THREE.DirectionalLight(0x0088ff, 1.5); // Blueish moonlight
moonlight.position.set(-50, 100, -50);
scene.add(moonlight);

// 3. PROCEDURAL ROAD (Wet Asphalt)
function makeRoadTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0a0a0f'; ctx.fillRect(0, 0, 512, 512); // Very dark
  // Yellow lines
  ctx.fillStyle = '#ffaa00'; ctx.fillRect(248, 0, 6, 512); ctx.fillRect(258, 0, 6, 512);
  // White dashes
  ctx.fillStyle = '#ffffff';
  for(let i=0; i<512; i+=64) { ctx.fillRect(120, i, 4, 32); ctx.fillRect(388, i, 4, 32); }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(1, 20);
  return tex;
}

const roadMat = new THREE.MeshStandardMaterial({ 
  map: makeRoadTexture(), 
  roughness: 0.05, // Super shiny wet road
  metalness: 0.9,  // Highly reflective
  color: 0xffffff
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), roadMat);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// 4. DENSE NEON CITY
const collidables = [];
const neonColors = [0xff00ff, 0x00ffff, 0xff0055, 0xffff00];

for(let x = -200; x <= 200; x += 40) {
  for(let z = -200; z <= 200; z += 40) {
    if(Math.abs(x) < 30 && Math.abs(z) < 30) continue; // Spawn area

    // Skyscraper
    const h = Math.random() * 80 + 20;
    const w = Math.random() * 15 + 15;
    const d = Math.random() * 15 + 15;
    
    const bMat = new THREE.MeshStandardMaterial({ color: 0x111116, roughness: 0.8 });
    const bGeo = new THREE.BoxGeometry(w, h, d);
    const building = new THREE.Mesh(bGeo, bMat);
    building.position.set(x, h/2, z);
    scene.add(building);
    collidables.push({ x: x, z: z, r: Math.max(w, d)/2 + 2 });

    // Glowing Neon Strips on Buildings
    for(let ny = 5; ny < h; ny += 15) {
      if(Math.random() > 0.3) continue;
      const neonMat = new THREE.MeshBasicMaterial({ color: neonColors[Math.floor(Math.random()*4)] });
      const neon = new THREE.Mesh(new THREE.BoxGeometry(w+1, 1, d+1), neonMat);
      neon.position.set(x, ny, z);
      scene.add(neon);
    }

    // Palm Trees (Procedural)
    if(Math.random() > 0.7) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.6, 12), new THREE.MeshBasicMaterial({ color: 0x221100 }));
      trunk.position.y = 6; tree.add(trunk);
      const leafMat = new THREE.MeshBasicMaterial({ color: 0x004400, side: THREE.DoubleSide });
      for(let i=0; i<6; i++) {
        const leaf = new THREE.Mesh(new THREE.PlaneGeometry(10, 2), leafMat);
        leaf.position.y = 12; leaf.rotation.y = (i/6)*Math.PI*2; leaf.rotation.x = Math.PI/4;
        leaf.position.x = Math.cos(leaf.rotation.y)*4; leaf.position.z = Math.sin(leaf.rotation.y)*4;
        tree.add(leaf);
      }
      tree.position.set(x + w/2 + 5, 0, z + d/2 + 5);
      scene.add(tree);
    }
  }
}

// 5. THE CAR (Sleek Sports Car)
const car = new THREE.Group();
// Main body (White)
const body = new THREE.Mesh(
  new THREE.BoxGeometry(2.2, 0.6, 4.6), 
  new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.8, roughness: 0.1 })
);
body.position.y = 0.6;
// Cabin (Black Glass)
const cabin = new THREE.Mesh(
  new THREE.BoxGeometry(1.8, 0.5, 2.2), 
  new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 1.0, roughness: 0.0 })
);
cabin.position.set(0, 1.15, -0.2);
// Red Stripe
const stripe = new THREE.Mesh(
  new THREE.BoxGeometry(0.4, 0.61, 4.6), 
  new THREE.MeshBasicMaterial({ color: 0xff0000 })
);
stripe.position.y = 0.6;
// Headlights (Glowing White)
const hl = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: 0xffffff }));
hl.position.set(0, 0.6, 2.31);
// Taillights (Glowing Red)
const tl = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
tl.position.set(0, 0.6, -2.31);

car.add(body, cabin, stripe, hl, tl);
scene.add(car);

// 6. ARCADE PHYSICS
let carPos = new THREE.Vector3(0, 0, 0);
let carAngle = 0, carSpeed = 0, camAngle = 0;
const keys = { w: false, a: false, s: false, d: false, space: false };

const overlay = document.getElementById('overlay');
overlay.addEventListener('click', () => {
  overlay.style.display = 'none';
  document.getElementById('speedo').style.display = 'block';
  renderer.domElement.requestPointerLock();
});

document.addEventListener('mousemove', (e) => {
  if (document.pointerLockElement === renderer.domElement) {
    camAngle -= e.movementX * 0.002;
  }
});

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if(k === 'w') keys.w = true; if(k === 's') keys.s = true;
  if(k === 'a') keys.a = true; if(k === 'd') keys.d = true;
  if(k === ' ') keys.space = true;
});
window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if(k === 'w') keys.w = false; if(k === 's') keys.s = false;
  if(k === 'a') keys.a = false; if(k === 'd') keys.d = false;
  if(k === ' ') keys.space = false;
});

// 7. MINIMAP
const mapCtx = document.getElementById('minimap').getContext('2d');
function drawMinimap() {
  mapCtx.clearRect(0, 0, 180, 180);
  mapCtx.save();
  mapCtx.translate(90, 90);
  mapCtx.rotate(-camAngle);
  
  // Draw Buildings
  mapCtx.fillStyle = 'rgba(255,0,255,0.3)';
  collidables.forEach(b => {
    const dx = (b.x - carPos.x) * 0.4; const dz = (b.z - carPos.z) * 0.4;
    if(Math.hypot(dx, dz) < 90) mapCtx.fillRect(dx - 4, dz - 4, 8, 8);
  });
  mapCtx.restore();
  
  // Player Arrow
  mapCtx.fillStyle = '#00ffff';
  mapCtx.beginPath(); mapCtx.moveTo(90, 80); mapCtx.lineTo(80, 100); mapCtx.lineTo(100, 100); mapCtx.fill();
}

// 8. GAME LOOP
function animate() {
  requestAnimationFrame(animate);
  try {
    // Physics
    if (keys.w) carSpeed += 0.4;
    else if (keys.s) carSpeed -= 0.2;
    else carSpeed *= 0.95;

    if (keys.space) carSpeed *= 0.9;
    carSpeed = Math.max(-1.5, Math.min(3.5, carSpeed));

    if (Math.abs(carSpeed) > 0.1) {
      if (keys.a) carAngle += 0.05;
      if (keys.d) carAngle -= 0.05;
    }

    let nextX = carPos.x + Math.sin(carAngle) * carSpeed;
    let nextZ = carPos.z + Math.cos(carAngle) * carSpeed;

    // Collision
    let hit = false;
    collidables.forEach(b => { if(Math.hypot(nextX - b.x, nextZ - b.z) < b.r) hit = true; });

    if (!hit) { carPos.x = nextX; carPos.z = nextZ; } 
    else { carSpeed = -carSpeed * 0.5; }

    // Update Car
    car.position.copy(carPos);
    car.rotation.y = carAngle;

    // Camera
    const camDist = 13;
    camera.position.x = carPos.x - Math.sin(camAngle) * camDist;
    camera.position.z = carPos.z - Math.cos(camAngle) * camDist;
    camera.position.y = 6;
    camera.lookAt(carPos.x, 1, carPos.z);

    // HUD
    document.getElementById('speedo').innerHTML = Math.floor(Math.abs(carSpeed) * 25) + ' <span>MPH</span>';
    drawMinimap();

    renderer.render(scene, camera);
  } catch (e) {
    console.error(e); // Prevents black screen freeze
  }
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>VICE CITY - LEONIDA</title>
<style>
  body{margin:0;overflow:hidden;background:#87CEEB;font-family:'Segoe UI',Arial,sans-serif;color:#fff;user-select:none}
  
  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  #speedo{position:absolute;bottom:30px;right:30px;font-size:60px;font-weight:900;color:#fff;text-shadow:0 0 20px #ff00ff, 0 0 10px #00ffff;display:none;font-style:italic;letter-spacing:-2px}
  #speedo span{font-size:18px;color:#00ffff;letter-spacing:2px}
  #minimap{position:absolute;bottom:30px;left:30px;width:160px;height:160px;border-radius:50%;border:4px solid rgba(255,255,255,0.8);background:rgba(0,0,0,0.6);box-shadow:0 0 20px rgba(0,0,0,0.5)}
  #jobPrompt{position:absolute;top:20%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);padding:15px 30px;border-radius:10px;font-size:20px;font-weight:bold;border:2px solid #ffcc00;color:#ffcc00;display:none;text-align:center}

  /* START SCREEN & SERVER SELECTOR */
  #overlay{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(180deg, #1a0b2e 0%, #ff00ff 100%);
    transition: opacity 0.5s;
  }
  h1{font-size:80px;margin:0;color:#fff;font-style:italic;letter-spacing:8px;text-shadow:0 0 30px #00ffff, 0 0 60px #00ffff}
  .server-panel{margin-top:30px;background:rgba(0,0,0,0.6);padding:30px;border-radius:15px;border:1px solid #00ffff;text-align:center}
  .server-btn{display:block;width:300px;margin:10px auto;padding:15px;background:#00ffff;color:#000;font-weight:bold;font-size:18px;border:none;border-radius:8px;cursor:pointer;transition:0.2s}
  .server-btn:hover{background:#fff;box-shadow:0 0 15px #00ffff}
  .code-input{margin-top:15px;padding:10px;font-size:18px;text-align:center;width:150px;border-radius:5px;border:none;letter-spacing:5px}
  .private-btn{margin-top:10px;padding:10px 30px;background:#ff00ff;color:#fff;font-weight:bold;border:none;border-radius:5px;cursor:pointer}
</style>
</head>
<body>

<div id="hud">
  <div id="speedo">0 <span>MPH</span></div>
  <canvas id="minimap" width="160" height="160"></canvas>
  <div id="jobPrompt">Press E to become a Police Officer 👮‍♂️</div>
</div>

<div id="overlay">
  <h1>VICE CITY</h1>
  <div class="server-panel">
    <button class="server-btn" id="globalBtn">🌍 Join Global Server</button>
    <br>
    <input type="text" id="codeInput" class="code-input" placeholder="12345" maxlength="5">
    <br>
    <button class="private-btn" id="privateBtn">🔒 Join Private Server</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// --- 1. ENGINE SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB); // Bright Day Sky
scene.fog = new THREE.Fog(0x87CEEB, 150, 500);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// --- 2. PHYSICS WORLD ---
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -20, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;

const groundMaterial = new CANNON.Material('ground');
const carMaterial = new CANNON.Material('car');
world.addContactMaterial(new CANNON.ContactMaterial(groundMaterial, carMaterial, {
  friction: 0.1,
  restitution: 0.2
}));

// --- 3. LIGHTING (Locked to Daytime) ---
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
hemiLight.position.set(0, 200, 0);
scene.add(hemiLight);

const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(100, 200, 100); // Fixed sun position
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.left = -200;
sun.shadow.camera.right = 200;
sun.shadow.camera.top = 200;
sun.shadow.camera.bottom = -200;
scene.add(sun);

// --- 4. PROCEDURAL TEXTURES ---
function makeRoadTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#444444'; ctx.fillRect(0, 0, 512, 512); // Lighter asphalt
  ctx.fillStyle = '#ffcc00'; ctx.fillRect(248, 0, 6, 512); ctx.fillRect(258, 0, 6, 512);
  ctx.fillStyle = '#ffffff';
  for(let i=0; i<512; i+=64) { ctx.fillRect(120, i, 4, 32); ctx.fillRect(388, i, 4, 32); }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(1, 10);
  return tex;
}

function makeBuildingTexture(color) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color; ctx.fillRect(0, 0, 256, 256);
  ctx.fillStyle = '#ffffff';
  for(let y=10; y<250; y+=40) {
    for(let x=10; x<250; x+=40) {
      ctx.fillRect(x, y, 20, 25);
    }
  }
  return new THREE.CanvasTexture(c);
}

const roadTex = makeRoadTexture();
const buildingTex = makeBuildingTexture('#888888');
const hospitalTex = makeBuildingTexture('#ffcccc');
const policeTex = makeBuildingTexture('#ccccff');
const fireTex = makeBuildingTexture('#ff8888');
const houseTex = makeBuildingTexture('#eeddaa');

// --- 5. WORLD GENERATION ---
const collidables = []; // {x, z, w, d} for minimap
const jobs = []; // {x, z, type}

// Ground
const groundMat = new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.8 });
const groundGeo = new THREE.PlaneGeometry(1000, 1000);
const groundMesh = new THREE.Mesh(groundGeo, groundMat);
groundMesh.rotation.x = -Math.PI/2;
groundMesh.receiveShadow = true;
scene.add(groundMesh);

const groundBody = new CANNON.Body({ mass: 0, material: groundMaterial });
groundBody.addShape(new CANNON.Plane());
groundBody.quaternion.setFromEuler(-Math.PI/2, 0, 0);
world.addBody(groundBody);

// Sidewalks and Buildings
const neonColors = [0xff00ff, 0x00ffff, 0xffaa00];
for(let x = -200; x <= 200; x += 60) {
  for(let z = -200; z <= 200; z += 60) {
    if(Math.abs(x) < 30 && Math.abs(z) < 30) continue;
    
    const h = Math.random() * 30 + 20;
    const w = Math.random() * 15 + 15;
    const d = Math.random() * 15 + 15;
    
    let tex = buildingTex;
    let isJob = false;
    let jobType = '';
    if (Math.random() > 0.85) { tex = policeTex; isJob = true; jobType = 'police'; }
    else if (Math.random() > 0.85) { tex = hospitalTex; isJob = true; jobType = 'hospital'; }
    else if (Math.random() > 0.85) { tex = fireTex; isJob = true; jobType = 'fire'; }
    else if (Math.random() > 0.6) { tex = houseTex; }

    const bMat = new THREE.MeshStandardMaterial({ map: tex });
    const bGeo = new THREE.BoxGeometry(w, h, d);
    const building = new THREE.Mesh(bGeo, bMat);
    building.position.set(x, h/2, z);
    building.castShadow = true;
    building.receiveShadow = true;
    scene.add(building);
    
    // Add physics body
    const bBody = new CANNON.Body({ mass: 0, material: groundMaterial });
    bBody.addShape(new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2)));
    bBody.position.set(x, h/2, z);
    world.addBody(bBody);

    collidables.push({ x: x, z: z, w: w, d: d });
    if(isJob) jobs.push({ x: x, z: z, type: jobType });

    // Sidewalk
    const sw = new THREE.Mesh(new THREE.BoxGeometry(w+10, 0.2, d+10), new THREE.MeshStandardMaterial({ color: 0xbbbbbb }));
    sw.position.set(x, 0.1, z);
    sw.receiveShadow = true;
    scene.add(sw);

    // Neon Strips on buildings (Vice City Vibe)
    if(Math.random() > 0.4) {
      const neonMat = new THREE.MeshBasicMaterial({ color: neonColors[Math.floor(Math.random()*3)] });
      const neon = new THREE.Mesh(new THREE.BoxGeometry(w+1, 1.5, d+1), neonMat);
      neon.position.set(x, Math.random() * h, z);
      scene.add(neon);
    }
    
    // Palm Trees
    if(Math.random() > 0.7) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.6, 12), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
      trunk.position.y = 6; trunk.castShadow = true; tree.add(trunk);
      const leafMat = new THREE.MeshStandardMaterial({ color: 0x228822, side: THREE.DoubleSide });
      for(let i=0; i<6; i++) {
        const leaf = new THREE.Mesh(new THREE.PlaneGeometry(10, 3), leafMat);
        leaf.position.y = 12; leaf.rotation.y = (i/6)*Math.PI*2; leaf.rotation.x = Math.PI/4;
        leaf.position.x = Math.cos(leaf.rotation.y)*4; leaf.position.z = Math.sin(leaf.rotation.y)*4;
        leaf.castShadow = true;
        tree.add(leaf);
      }
      tree.position.set(x + w/2 + 6, 0, z + d/2 + 6);
      scene.add(tree);
    }
  }
}

// --- 6. PLAYER CAR ---
const carGroup = new THREE.Group();
const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.6, roughness: 0.3 }); // White Car
const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.6, 4.6), bodyMat);
body.position.y = 0.6; body.castShadow = true;
const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.5, 2.2), new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 1.0, roughness: 0.0 }));
cabin.position.set(0, 1.15, -0.2); cabin.castShadow = true;
const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.61, 4.6), new THREE.MeshStandardMaterial({ color: 0xff0000 })); // Red Stripe
stripe.position.y = 0.6;
const hl = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: 0xffffff }));
hl.position.set(0, 0.6, 2.31);
const tl = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
tl.position.set(0, 0.6, -2.31);

// Wheels
const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
wheelGeo.rotateZ(Math.PI/2);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
const wheels = [];
[[1.1, 0.4, 1.4], [-1.1, 0.4, 1.4], [1.1, 0.4, -1.4], [-1.1, 0.4, -1.4]].forEach(pos => {
  const w = new THREE.Mesh(wheelGeo, wheelMat);
  w.position.set(pos[0], pos[1], pos[2]);
  w.castShadow = true;
  carGroup.add(w);
  wheels.push(w);
});

carGroup.add(body, cabin, stripe, hl, tl);
scene.add(carGroup);

// Car Physics Body (Heavier mass so it doesn't fly)
const chassisShape = new CANNON.Box(new CANNON.Vec3(1.1, 0.3, 2.3));
const chassisBody = new CANNON.Body({ mass: 800, material: carMaterial }); 
chassisBody.addShape(chassisShape);
chassisBody.position.set(0, 2, 0);
chassisBody.angularDamping = 0.8; 
world.addBody(chassisBody);

// Raycast Vehicle
const vehicle = new CANNON.RaycastVehicle({
  chassisBody: chassisBody,
  indexRightAxis: 0,
  indexUpAxis: 1,
  indexForwardAxis: 2
});

const wheelOptions = {
  radius: 0.4,
  directionLocal: new CANNON.Vec3(0, -1, 0),
  suspensionStiffness: 30,
  suspensionRestLength: 0.3,
  frictionSlip: 2.5, // Lower friction so it doesn't spin out instantly
  dampingRelaxation: 2.3,
  dampingCompression: 4.4,
  maxSuspensionForce: 100000,
  rollInfluence: 0.01,
  axleLocal: new CANNON.Vec3(-1, 0, 0),
  chassisConnectionPointLocal: new CANNON.Vec3(1, 1, 0),
  maxSuspensionTravel: 0.3,
  customSlidingRotationalSpeed: -30,
  useCustomSlidingRotationalSpeed: true
};

wheelOptions.chassisConnectionPointLocal.set(1.1, 0.3, 1.4);
vehicle.addWheel(wheelOptions);
wheelOptions.chassisConnectionPointLocal.set(-1.1, 0.3, 1.4);
vehicle.addWheel(wheelOptions);
wheelOptions.chassisConnectionPointLocal.set(1.1, 0.3, -1.4);
vehicle.addWheel(wheelOptions);
wheelOptions.chassisConnectionPointLocal.set(-1.1, 0.3, -1.4);
vehicle.addWheel(wheelOptions);

vehicle.addToWorld(world);

// --- 7. CONTROLS ---
let currentJob = null;
const keys = { w: false, a: false, s: false, d: false, space: false };

const overlay = document.getElementById('overlay');
const codeInput = document.getElementById('codeInput');

function startGame() {
  overlay.style.display = 'none';
  document.getElementById('speedo').style.display = 'block';
  renderer.domElement.requestPointerLock();
}

document.getElementById('globalBtn').addEventListener('click', startGame);
document.getElementById('privateBtn').addEventListener('click', () => {
  if(codeInput.value.length === 5) {
    alert(`Connecting to Private Server: ${codeInput.value}`);
    startGame();
  } else {
    alert("Please enter a 5-digit code!");
  }
});

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if(k === 'w') keys.w = true; if(k === 's') keys.s = true;
  if(k === 'a') keys.a = true; if(k === 'd') keys.d = true;
  if(k === ' ') keys.space = true;
  
  if(k === 'e' && currentJob) {
    document.getElementById('jobPrompt').innerText = `You are now a ${currentJob.toUpperCase()}! 🚨`;
    setTimeout(() => document.getElementById('jobPrompt').style.display = 'none', 3000);
  }
});
window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if(k === 'w') keys.w = false; if(k === 's') keys.s = false;
  if(k === 'a') keys.a = false; if(k === 'd') keys.d = false;
  if(k === ' ') keys.space = false;
});

// --- 8. MINIMAP ---
const mapCtx = document.getElementById('minimap').getContext('2d');
function drawMinimap(carPos, camAngle) {
  mapCtx.clearRect(0, 0, 160, 160);
  mapCtx.fillStyle = '#111'; mapCtx.fillRect(0, 0, 160, 160); // Dark background
  
  mapCtx.save();
  mapCtx.translate(80, 80);
  mapCtx.rotate(-camAngle);
  
  // Draw Roads
  mapCtx.strokeStyle = 'rgba(255,255,255,0.2)';
  mapCtx.lineWidth = 8;
  for(let i = -300; i <= 300; i += 60) {
    mapCtx.beginPath(); mapCtx.moveTo(i * 0.5, -100); mapCtx.lineTo(i * 0.5, 100); mapCtx.stroke();
    mapCtx.beginPath(); mapCtx.moveTo(-100, i * 0.5); mapCtx.lineTo(100, i * 0.5); mapCtx.stroke();
  }

  // Draw Buildings
  mapCtx.fillStyle = '#666';
  collidables.forEach(b => {
    const dx = (b.x - carPos.x) * 0.5; const dz = (b.z - carPos.z) * 0.5;
    if(Math.hypot(dx, dz) < 80) {
      mapCtx.fillRect(dx - b.w*0.5, dz - b.d*0.5, b.w, b.d);
    }
  });
  mapCtx.restore();
  
  // Player Arrow
  mapCtx.fillStyle = '#00ffff';
  mapCtx.beginPath(); mapCtx.moveTo(80, 70); mapCtx.lineTo(70, 90); mapCtx.lineTo(90, 90); mapCtx.fill();
}

// --- 9. GAME LOOP ---
const clock = new THREE.Clock();
const fixedTimeStep = 1/60;
let camAngle = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  try {
    // Vehicle Physics Controls
    const maxEngineForce = 400; // MUCH lower force so it accelerates slowly
    const brakeForce = 20;
    
    // Reset forces
    vehicle.applyEngineForce(0, 2);
    vehicle.applyEngineForce(0, 3);
    vehicle.setBrake(0, 0); vehicle.setBrake(0, 1); vehicle.setBrake(0, 2); vehicle.setBrake(0, 3);

    // Drive forwards / backwards
    if (keys.w) {
      vehicle.applyEngineForce(-maxEngineForce, 2);
      vehicle.applyEngineForce(-maxEngineForce, 3);
    } else if (keys.s) {
      vehicle.applyEngineForce(maxEngineForce/2, 2);
      vehicle.applyEngineForce(maxEngineForce/2, 3);
    } else {
      // Natural friction/engine braking to slow down
      vehicle.setBrake(2, 2); vehicle.setBrake(2, 3);
    }

    // Steering
    const maxSteerVal = 0.4;
    if (keys.a) {
      vehicle.setSteeringValue(maxSteerVal, 0);
      vehicle.setSteeringValue(maxSteerVal, 1);
    } else if (keys.d) {
      vehicle.setSteeringValue(-maxSteerVal, 0);
      vehicle.setSteeringValue(-maxSteerVal, 1);
    } else {
      vehicle.setSteeringValue(0, 0);
      vehicle.setSteeringValue(0, 1);
    }

    // Handbrake
    if (keys.space) {
      vehicle.setBrake(brakeForce, 0); vehicle.setBrake(brakeForce, 1);
      vehicle.setBrake(brakeForce, 2); vehicle.setBrake(brakeForce, 3);
    }

    // Step the physics world
    world.step(fixedTimeStep, dt, 3);

    // Sync car mesh with physics body
    carGroup.position.copy(chassisBody.position);
    carGroup.quaternion.copy(chassisBody.quaternion);

    // Sync wheels
    for (let i = 0; i < vehicle.wheelInfos.length; i++) {
      const wheelInfo = vehicle.wheelInfos[i];
      const wheel = wheels[i];
      wheel.position.copy(wheelInfo.worldTransform.position);
      wheel.quaternion.copy(wheelInfo.worldTransform.quaternion);
    }

    // Camera Follow
    const carPos = chassisBody.position;
    camAngle = Math.atan2(-chassisBody.quaternion.y, -chassisBody.quaternion.w) * 2; 
    const camDist = 12;
    camera.position.x = carPos.x - Math.sin(camAngle) * camDist;
    camera.position.z = carPos.z - Math.cos(camAngle) * camDist;
    camera.position.y = 6;
    camera.lookAt(carPos.x, 1, carPos.z);

    // Job Check
    currentJob = null;
    jobs.forEach(j => {
      if (Math.hypot(carPos.x - j.x, carPos.z - j.z) < 20) {
        currentJob = j.type;
        const prompt = document.getElementById('jobPrompt');
        prompt.innerText = `Press E to become a ${currentJob} 👮‍♂️🚒`;
        prompt.style.display = 'block';
      }
    });
    if (!currentJob) document.getElementById('jobPrompt').style.display = 'none';

    // HUD Updates (Cap the speed at realistic numbers for the display)
    let speed = Math.abs(vehicle.currentVehicleSpeedKmHour);
    document.getElementById('speedo').innerHTML = Math.floor(speed) + ' <span>KM/H</span>';
    drawMinimap(carPos, camAngle);

    renderer.render(scene, camera);
  } catch (e) {
    console.error(e);
  }
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>

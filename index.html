<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>VICE CITY</title>
<style>
  body{margin:0;overflow:hidden;background:#000;font-family:sans-serif;color:#fff;user-select:none}
  #speedo{position:fixed;bottom:20px;left:20px;font-size:50px;font-weight:900;color:#fff;text-shadow:0 0 20px #ff00ff, 0 2px 5px #000;display:none;font-style:italic;z-index:10}
  #speedo span{font-size:16px;color:#00ffff}
  #overlay{position:fixed;inset:0;background:linear-gradient(to bottom, #2a0845, #6441A5);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;cursor:pointer}
  #overlay h1{font-size:60px;margin-bottom:10px;color:#ff00ff;text-shadow:0 0 30px #ff00ff;font-style:italic}
  #overlay p{font-size:20px;color:#00ffff}
</style>
</head>
<body>
<div id="speedo">0 <span>MPH</span></div>
<div id="overlay"><h1>VICE CITY</h1><p>Click to drive</p></div>

<!-- ONLY ONE LIBRARY (No imports needed) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// 1. Setup Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xff7597); // Pink sky
scene.fog = new THREE.Fog(0xff7597, 50, 300);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 2. Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(50, 100, 50);
scene.add(sun);

// 3. Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1000, 1000),
  new THREE.MeshBasicMaterial({ color: 0x222222 })
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// 4. City Buildings
const buildings = [];
for(let x = -100; x <= 100; x += 30) {
  for(let z = -100; z <= 100; z += 30) {
    if(x === 0 && z === 0) continue;
    
    const h = Math.random() * 40 + 10;
    const color = Math.random() > 0.5 ? 0x222233 : 0x332244;
    const box = new THREE.Mesh(
      new THREE.BoxGeometry(15, h, 15),
      new THREE.MeshBasicMaterial({ color: color })
    );
    box.position.set(x, h/2, z);
    scene.add(box);
    
    // Neon strips
    if(Math.random() > 0.5) {
      const neon = new THREE.Mesh(
        new THREE.BoxGeometry(16, 2, 16),
        new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0xff00ff : 0x00ffff })
      );
      neon.position.set(x, Math.random()*h, z);
      scene.add(neon);
    }
  }
}

// 5. Player Car
const car = new THREE.Group();
const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
body.position.y = 0.5;
const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.55, 4), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
stripe.position.y = 0.5;
const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 1.5), new THREE.MeshBasicMaterial({ color: 0x000000 }));
windshield.position.set(0, 1, -0.2);
car.add(body, stripe, windshield);
scene.add(car);

// 6. Custom Simple Physics (No Cannon-es needed!)
let carPos = new THREE.Vector3(0, 0, 0);
let carAngle = 0;
let carSpeed = 0;

const keys = { w: false, a: false, s: false, d: false };

// Click to start
const overlay = document.getElementById('overlay');
overlay.addEventListener('click', () => {
  overlay.style.display = 'none';
  document.getElementById('speedo').style.display = 'block';
});

// Keyboard
window.addEventListener('keydown', (e) => {
  if(e.key.toLowerCase() === 'w') keys.w = true;
  if(e.key.toLowerCase() === 'a') keys.a = true;
  if(e.key.toLowerCase() === 's') keys.s = true;
  if(e.key.toLowerCase() === 'd') keys.d = true;
});
window.addEventListener('keyup', (e) => {
  if(e.key.toLowerCase() === 'w') keys.w = false;
  if(e.key.toLowerCase() === 'a') keys.a = false;
  if(e.key.toLowerCase() === 's') keys.s = false;
  if(e.key.toLowerCase() === 'd') keys.d = false;
});

// 7. Game Loop
function animate() {
  requestAnimationFrame(animate);

  // Driving Logic (W goes forward!)
  if (keys.w) carSpeed += 0.5;
  else if (keys.s) carSpeed -= 0.5;
  else carSpeed *= 0.95; // Friction

  // Steering (Only turn if moving)
  if (Math.abs(carSpeed) > 0.5) {
    if (keys.a) carAngle += 0.05;
    if (keys.d) carAngle -= 0.05;
  }

  // Move the car based on angle
  carPos.x += Math.sin(carAngle) * carSpeed;
  carPos.z += Math.cos(carAngle) * carSpeed;

  // Update car position on screen
  car.position.copy(carPos);
  car.rotation.y = carAngle;

  // Camera Follow
  camera.position.x = carPos.x - Math.sin(carAngle) * 12;
  camera.position.z = carPos.z - Math.cos(carAngle) * 12;
  camera.position.y = 6;
  camera.lookAt(carPos.x, 1, carPos.z);

  // Update Speedometer
  document.getElementById('speedo').innerHTML = Math.floor(Math.abs(carSpeed) * 3) + ' <span>MPH</span>';

  renderer.render(scene, camera);
}

// Handle window resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>

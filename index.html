<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NEON CITY</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:100%;height:100%;overflow:hidden;background:#05070a;font-family:sans-serif;color:#fff;user-select:none}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  #healthWrap{position:absolute;top:20px;left:20px;width:200px;height:15px;background:rgba(0,0,0,.5);border:2px solid #fff;border-radius:10px;overflow:hidden}
  #healthBar{height:100%;width:100%;background:#25d366;transition:width .2s}
  #stars{position:absolute;top:40px;left:20px;font-size:24px;color:#555;text-shadow:0 0 5px #000}
  .star.on{color:#ffd23f;text-shadow:0 0 10px #ffd23f}
  #cash{position:absolute;top:20px;right:20px;font-size:30px;font-weight:bold;color:#7dfba0;text-shadow:0 2px 5px #000}
  #speedo{position:absolute;bottom:20px;left:20px;font-size:40px;font-weight:bold;display:none;text-shadow:0 2px 5px #000}
  #speedo span{font-size:16px;color:#aaa}
  #help{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:14px;color:rgba(255,255,255,.7);text-shadow:0 1px 3px #000;text-align:center}
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;cursor:pointer}
  #overlay h1{font-size:50px;margin-bottom:10px;color:#4fc3ff;text-shadow:0 0 20px #4fc3ff}
  #overlay p{font-size:20px;margin-bottom:20px}
  #crosshair{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;background:red;border-radius:50%;display:none;box-shadow:0 0 5px #000}
</style>
</head>
<body>

<div id="hud">
  <div id="healthWrap"><div id="healthBar"></div></div>
  <div id="stars">★★★★★</div>
  <div id="cash">$0</div>
  <div id="speedo">0 <span>KM/H</span></div>
  <div id="crosshair"></div>
  <div id="help">WASD Move · Shift Sprint · Space Jump/Handbrake · E Enter/Exit Car · Click to lock mouse</div>
</div>

<div id="overlay">
  <h1>NEON CITY</h1>
  <p>Click anywhere to start playing</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// --- Setup Three.js Scene ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 50, 300);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// --- Setup Cannon-es Physics ---
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -20, 0) });
world.allowSleep = true;

// --- Lights ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(50, 100, 50);
dirLight.castShadow = true;
dirLight.shadow.camera.left = -100;
dirLight.shadow.camera.right = 100;
dirLight.shadow.camera.top = 100;
dirLight.shadow.camera.bottom = -100;
scene.add(dirLight);

// --- Create Ground ---
const groundGeo = new THREE.PlaneGeometry(1000, 1000);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
const groundMesh = new THREE.Mesh(groundGeo, groundMat);
groundMesh.rotation.x = -Math.PI / 2;
groundMesh.receiveShadow = true;
scene.add(groundMesh);

const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
world.addBody(groundBody);

// --- Create City (Procedural) ---
const buildings = [];
const buildingColors = [0x8899aa, 0x667788, 0x99aabb, 0x556677];
for(let x = -100; x <= 100; x += 30) {
  for(let z = -100; z <= 100; z += 30) {
    if(x === 0 && z === 0) continue; // Leave spawn empty
    const h = Math.random() * 40 + 20;
    const w = Math.random() * 10 + 10;
    const d = Math.random() * 10 + 10;
    
    // Mesh
    const geo = new THREE.BoxGeometry(w, h, d);
    const mat = new THREE.MeshStandardMaterial({ color: buildingColors[Math.floor(Math.random()*buildingColors.length)] });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, h/2, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    
    // Physics
    const body = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2)) });
    body.position.set(x, h/2, z);
    world.addBody(body);
  }
}

// --- Create Player ---
const playerGroup = new THREE.Group();
const pBodyMat = new THREE.MeshStandardMaterial({ color: 0x22aa22 });
const pHeadMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
const pTorso = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.5), pBodyMat);
pTorso.position.y = 0.75;
const pHead = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), pHeadMat);
pHead.position.y = 1.8;
playerGroup.add(pTorso, pHead);
playerGroup.castShadow = true;
scene.add(playerGroup);

const playerBody = new CANNON.Body({
  mass: 70,
  shape: new CANNON.Sphere(0.8),
  position: new CANNON.Vec3(0, 5, 0),
  linearDamping: 0.9,
  fixedRotation: true
});
world.addBody(playerBody);

// --- Create Car ---
const carGroup = new THREE.Group();
const carBodyMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 4), new THREE.MeshStandardMaterial({ color: 0xcc1111 }));
carBodyMesh.castShadow = true;
carBodyMesh.position.y = 0.5;
carGroup.add(carBodyMesh);
scene.add(carGroup);

const carBody = new CANNON.Body({
  mass: 500,
  shape: new CANNON.Box(new CANNON.Vec3(1, 0.5, 2)),
  position: new CANNON.Vec3(8, 1, 0),
  linearDamping: 0.5,
  angularDamping: 0.5
});
world.addBody(carBody);

// --- Controls ---
const keys = { w: false, a: false, s: false, d: false, shift: false, space: false, e: false };
let inCar = false;

document.addEventListener('keydown', (e) => {
  if(e.key === 'w' || e.key === 'W') keys.w = true;
  if(e.key === 'a' || e.key === 'A') keys.a = true;
  if(e.key === 's' || e.key === 'S') keys.s = true;
  if(e.key === 'd' || e.key === 'D') keys.d = true;
  if(e.key === 'Shift') keys.shift = true;
  if(e.key === ' ') keys.space = true;
  if(e.key === 'e' || e.key === 'E') tryEnterCar();
});
document.addEventListener('keyup', (e) => {
  if(e.key === 'w' || e.key === 'W') keys.w = false;
  if(e.key === 'a' || e.key === 'A') keys.a = false;
  if(e.key === 's' || e.key === 'S') keys.s = false;
  if(e.key === 'd' || e.key === 'D') keys.d = false;
  if(e.key === 'Shift') keys.shift = false;
  if(e.key === ' ') keys.space = false;
});

// Mouse Look
let mouseX = 0;
let mouseY = 0;
let cameraAngle = 0;
const overlay = document.getElementById('overlay');

overlay.addEventListener('click', () => {
  overlay.style.display = 'none';
  renderer.domElement.requestPointerLock();
});

document.addEventListener('mousemove', (e) => {
  if (document.pointerLockElement === renderer.domElement) {
    cameraAngle -= e.movementX * 0.002;
    mouseY = Math.max(-Math.PI/4, Math.min(Math.PI/4, mouseY - e.movementY * 0.002));
  }
});

// Enter/Exit Car
function tryEnterCar() {
  const dist = playerBody.position.distanceTo(carBody.position);
  if (dist < 5) {
    inCar = !inCar;
    document.getElementById('speedo').style.display = inCar ? 'block' : 'none';
    playerGroup.visible = !inCar;
    if (inCar) {
      playerBody.position.copy(carBody.position); // teleport player into car
    } else {
      playerBody.position.set(carBody.position.x + 3, carBody.position.y + 2, carBody.position.z); // hop out
    }
  }
}

// --- Animation Loop ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  
  const dt = Math.min(clock.getDelta(), 0.1);
  world.step(1/60, dt, 3);

  // Sync meshes to physics bodies
  playerGroup.position.copy(playerBody.position);
  playerGroup.quaternion.copy(playerBody.quaternion);
  carGroup.position.copy(carBody.position);
  carGroup.quaternion.copy(carBody.quaternion);

  // Movement Logic
  if (!inCar) {
    // Player walking
    const speed = keys.shift ? 20 : 10;
    playerBody.velocity.x = 0; // reset forces
    playerBody.velocity.z = 0;
    
    // Move relative to camera angle
    const forward = new CANNON.Vec3(Math.sin(cameraAngle), 0, Math.cos(cameraAngle));
    const right = new CANNON.Vec3(Math.cos(cameraAngle), 0, -Math.sin(cameraAngle));
    
    if (keys.w) { playerBody.velocity.x += forward.x * speed; playerBody.velocity.z += forward.z * speed; }
    if (keys.s) { playerBody.velocity.x -= forward.x * speed; playerBody.velocity.z -= forward.z * speed; }
    if (keys.a) { playerBody.velocity.x -= right.x * speed; playerBody.velocity.z -= right.z * speed; }
    if (keys.d) { playerBody.velocity.x += right.x * speed; playerBody.velocity.z += right.z * speed; }

    if (keys.space && Math.abs(playerBody.velocity.y) < 0.1) {
      playerBody.velocity.y = 10; // Jump
    }
    
    // Camera follow player
    const camDist = 8;
    camera.position.x = playerBody.position.x - Math.sin(cameraAngle) * camDist;
    camera.position.z = playerBody.position.z - Math.cos(cameraAngle) * camDist;
    camera.position.y = playerBody.position.y + 4 + (mouseY * -5);
    camera.lookAt(playerBody.position.x, playerBody.position.y + 1, playerBody.position.z);

  } else {
    // Car driving
    carBody.angularVelocity.set(0,0,0); // reset spin to keep it upright
    carBody.quaternion.setFromEuler(0, carBody.quaternion.toEuler().y, 0); // lock rotation
    
    const engineForce = 5000;
    const steerSpeed = 2;
    
    const forward = new CANNON.Vec3(0, 0, 1);
    carBody.quaternion.vmult(forward, forward); // get forward direction
    
    if (keys.w) {
      carBody.applyForce(forward.scale(engineForce), carBody.position);
    }
    if (keys.s) {
      carBody.applyForce(forward.scale(-engineForce), carBody.position);
    }
    
    if (keys.a) carBody.angularVelocity.y = steerSpeed;
    if (keys.d) carBody.angularVelocity.y = -steerSpeed;
    if (keys.space) carBody.velocity.scale(0.95, carBody.velocity); // handbrake

    // Update HUD Speedo
    const speed = Math.floor(carBody.velocity.length() * 3.6);
    document.getElementById('speedo').innerHTML = speed + ' <span>KM/H</span>';

    // Camera follow car
    const camDist = 12;
    camera.position.x = carBody.position.x - Math.sin(cameraAngle) * camDist;
    camera.position.z = carBody.position.z - Math.cos(cameraAngle) * camDist;
    camera.position.y = carBody.position.y + 6;
    camera.lookAt(carBody.position.x, carBody.position.y, carBody.position.z);
  }

  renderer.render(scene, camera);
}

// Resize handler
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
